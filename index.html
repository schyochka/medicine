{ n:1, title:'Карта метаболізму: що взагалі намальовано на схемі', time:'~25 хв', html:`
<div class="box"><b>Мета цієї теми.</b> Не вчити кожну реакцію, а зрозуміти <i>сенс</i> схеми: звідки беремо, куди веземо, що отримуємо. Як подивитися на карту міста перед тим, як вивчати вулиці.</div>
<h2>1. Навіщо нам їсти? Дві причини</h2>
<p>Уяви, що організм — це <b>місто</b>. Йому потрібні дві речі:</p>
<ol><li><b>Електрика</b> — щоб усе працювало (серце билося, м'язи скорочувалися, мозок думав).</li>
<li><b>Будматеріали</b> — щоб ремонтувати й будувати (нові клітини, гормони, ферменти).</li></ol>
<p>Їжа дає і те, і те. <b>Метаболізм</b> (обмін речовин) — це <b>всі хімічні перетворення речовин в організмі</b>. Схема — це «карта метаболізму».</p>
<h2>2. Розбирати і будувати: катаболізм і анаболізм</h2>
<table><tr><th></th><th>Катаболізм</th><th>Анаболізм</th></tr>
<tr><td>Простими словами</td><td>«Розібрати» — велике ламаємо на дрібне</td><td>«Зібрати» — з дрібного будуємо велике</td></tr>
<tr><td>Енергія</td><td><b>Вивільняється</b> (як дрова горять і дають тепло)</td><td><b>Витрачається</b> (будувати — це робота)</td></tr>
<tr><td>Приклад зі схеми</td><td>Глюкоза → Піруват (гліколіз), β-окиснення ЖК</td><td>Глюконеогенез, біосинтез ЖК</td></tr>
<tr><td>Напрям на схемі</td><td>Переважно стрілки <b>вниз</b></td><td>Стрілки <b>вгору</b></td></tr></table>
<div class="box mn">Лайфхак: <b>вниз = «спалюємо» (катаболізм)</b>, <b>вгору = «будуємо» (анаболізм)</b>.</div>
<h2>3. Три «валюти» на схемі</h2>
<h3>АТФ — батарейка</h3>
<p><b>АТФ</b> — <b>енергетична валюта</b> клітини. Заробили (при розпаді їжі) — витратили (на м'язи, насоси, синтез). Витрачений АТФ стає <b>АДФ + Ф</b>. Унизу схеми: <b>АДФ + Ф → АТФ</b> — це «зарядка батарейки».</p>
<h3>НАД·Н і ФАД·Н₂ — вантажівки з електронами</h3>
<p>Коли ми розбираємо їжу, від молекул відривається водень (а з ним — електрони, «енергія в чистому вигляді»). Його підбирають «вантажівки»: <b>НАД</b> (порожня) → <b>НАД·Н</b> (завантажена); <b>ФАД</b> → <b>ФАД·Н₂</b>. Вони везуть вантаж на «електростанцію» — <b>ЦПЕ</b> (дихальний ланцюг), де з нього роблять багато АТФ.</p>
<div class="box">НАД·Н і ФАД·Н₂ — ще не енергія, а «сировина» для енергії. «Зарплата» видається в ЦПЕ у вигляді АТФ.</div>
<h3>CO₂ — «вихлопні гази»</h3>
<p>Коли від молекули відрізається атом вуглецю, він іде у вигляді <b>CO₂</b>, кров везе його в легені — ми його видихаємо. Тому біля пірувату і в ЦТК стрілки «→ CO₂».</p>
<h2>4. Що означають C6, C3, C2</h2>
<p>Це <b>кількість атомів вуглецю</b> в молекулі — як деталі Лего:</p>
<ul><li>Глюкоза <b>(C6)</b> → ламаємо навпіл → <b>2 Пірувати (C3)</b>.</li>
<li>Від кожного пірувату відламуємо 1 деталь (CO₂) → <b>Ацетил-КоА (C2)</b>.</li>
<li>У ЦТК: C2 + оксалоацетат C4 = <b>цитрат C6</b>, далі відлітають два CO₂: C6 → C5 → C4… і знову C4 оксалоацетат. Коло замкнулося.</li></ul>
<div class="box mn">Число зменшилось — відщепився CO₂. Число зросло — щось приєдналося.</div>
<h2>5. Схема — будинок на три поверхи</h2>
<div class="flow">
<div class="floor"><b>Поверх 1 — Перетравлення (кишківник).</b> Великі молекули ріжемо <b>гідролізом</b> (розрізання за допомогою води): Жири → гліцерин + жирні кислоти · Вуглеводи → глюкоза · Білки → амінокислоти · НК → пентози + азотисті основи + H₃PO₄</div>
<div class="arrow">↓</div>
<div class="floor"><b>Поверх 2 — Спільна «валюта» (клітини).</b> Усе зводиться до кількох речовин: <b>піруват</b> і головне — <b>ацетил-КоА</b>.</div>
<div class="arrow">↓</div>
<div class="floor"><b>Поверх 3 — Спалювання (мітохондрії).</b> <b>ЦТК</b> добиває ацетил-КоА до CO₂ і завантажує НАД·Н/ФАД·Н₂. <b>ЦПЕ</b> розвантажує їх, використовує <b>O₂</b>, утворює <b>H₂O</b> і робить <b>АТФ</b>.</div></div>
<h2>6. Ацетил-КоА — центральний вокзал</h2>
<p>До ацетил-КоА сходяться вуглеводи (через піруват), жири (β-окиснення) і частина амінокислот. Звідси — поїзд у ЦТК, або назад — на синтез жирних кислот.</p>
<div class="box warn">Стрілка «Піруват → Ацетил-КоА» йде <b>лише в один бік</b>. Тому з жирних кислот глюкозу людина <b>не синтезує</b> (а з гліцерину — може).</div>
<h2>7. Де це відбувається</h2>
<table><tr><th>Місце</th><th>Що там</th></tr>
<tr><td>Кишківник</td><td>Гідроліз (перетравлення)</td></tr>
<tr><td>Цитоплазма</td><td>Гліколіз, пентозофосфатний шлях, синтез жирних кислот</td></tr>
<tr><td><b>Мітохондрія</b></td><td>Декарбоксилювання пірувату, β-окиснення, <b>ЦТК</b>, <b>ЦПЕ</b></td></tr></table>
<h2>8. Навіщо кисень у самому низу</h2>
<p>У ЦПЕ електрони біжать по ланцюжку, як вода по каскаду млинів. Наприкінці їх треба «скинути»: <b>кисень — кінцевий приймач (акцептор) електронів</b>, з воднем утворює <b>воду</b>. Немає кисню → ланцюг стоїть → НАД·Н не розвантажується → ЦТК теж стає → АТФ майже немає.</p>
<div class="box clin"><b>Клініка.</b> Тому гіпоксія швидко вбиває нейрони й кардіоміоцити. Ціаніди блокують ЦПЕ — клітина «задихається» при нормальному кисні в крові. Без кисню АТФ дає лише гліколіз, накопичується лактат — лактат-ацидоз при шоці.</div>

{ n:2, title:'Перетравлення: гідроліз жирів, вуглеводів, білків, НК', time:'~30 хв', html:`
<div class="box"><b>Де ми на схемі:</b> верхній ряд — <b>Жири, Вуглеводи, НК, Білки</b> і слово <b>«гідроліз»</b>.</div>
<h2>1. Навіщо перетравлювати?</h2>
<p>Велику шафу через вузькі двері не занесеш — її <b>розбирають на дошки</b>. Молекули їжі (крохмаль, білок, жир) <b>величезні</b> і через стінку кишки не проходять. Кишківник розбирає їх на «цеглинки» (<b>мономери</b>), ті всмоктуються, а в клітинах з них або добувається енергія, або будується своє — свої білки, жир, глікоген.</p>
<div class="box">Тому біля «Вуглеводи», «НК» на схемі стрілки <b>в обидва боки</b>: вниз — розбираємо чуже, вгору — будуємо своє.</div>
<h2>2. Гідроліз — «ножиці з водою»</h2>
<p><b>Гідроліз</b> — розрізання зв'язку <b>з приєднанням води</b> (H — до одного шматка, OH — до іншого). Пришвидшують це <b>ферменти</b> — «ножиці». Назви часто на <b>-аза</b>:</p>
<table><tr><th>Фермент</th><th>Що ріже</th></tr>
<tr><td>Амілаза</td><td>крохмаль</td></tr><tr><td>Лактаза</td><td>лактозу (молочний цукор)</td></tr>
<tr><td>Ліпаза</td><td>жири</td></tr><tr><td>Протеази (пепсин, трипсин)</td><td>білки</td></tr><tr><td>Нуклеази</td><td>нуклеїнові кислоти</td></tr></table>
<h2>3. Маршрут їжі</h2>
<div class="flow">
<div class="floor"><b>Рот</b> — жування + амілаза слини починає різати крохмаль.</div><div class="arrow">↓</div>
<div class="floor"><b>Шлунок</b> — соляна кислота (HCl), починається перетравлення <b>білків</b> (пепсин).</div><div class="arrow">↓</div>
<div class="floor"><b>Дванадцятипала кишка</b> — головний «цех»: <b>сік підшлункової</b> (майже всі ферменти) + <b>жовч</b>.</div><div class="arrow">↓</div>
<div class="floor"><b>Тонка кишка</b> — ферменти на поверхні клітин («щіткова облямівка») роблять останній розріз; тут <b>всмоктування</b>.</div><div class="arrow">↓</div>
<div class="floor"><b>Товста кишка</b> — всмоктується вода; бактерії «доїдають» клітковину.</div></div>
<h2>4. Вуглеводи → глюкоза</h2>
<table><tr><th>Розмір</th><th>Приклади</th><th>Аналогія</th></tr>
<tr><td><b>Полісахариди</b></td><td>крохмаль, глікоген</td><td>довге намисто</td></tr>
<tr><td><b>Дисахариди</b></td><td>сахароза, лактоза, мальтоза</td><td>дві намистини</td></tr>
<tr><td><b>Моносахариди</b></td><td><b>глюкоза</b>, фруктоза, галактоза</td><td>одна намистина</td></tr></table>
<p><b>Всмоктуються тільки моносахариди.</b> Рот (амілаза слини) → шлунок (кислота вимикає амілазу) → 12-пала кишка (амілаза підшлункової → мальтоза) → тонка кишка (<b>мальтаза, сахараза, лактаза</b>) → глюкоза → <b>ворітна вена → печінка</b>.</p>
<div class="box warn"><b>Клітковина (целюлоза)</b> — теж з глюкози, але з іншим типом зв'язку, для якого в людини немає ферменту. Вона проходить неперетравленою, годує корисні бактерії й допомагає роботі кишки.</div>
<div class="box clin"><b>Непереносимість лактози.</b> Мало лактази → лактоза доходить до товстої кишки, бактерії її бродять → <b>здуття, бурчання, діарея</b> після молока. Кефір і тверді сири переносяться краще.</div>
<h2>5. Жири → гліцерин + жирні кислоти</h2>
<p>Харчовий жир — <b>триацилгліцерол (ТАГ)</b>: до <b>гліцерину</b> причеплено <b>три жирні кислоти</b>.</p>
<p><b>Проблема:</b> жир не змішується з водою, збирається у великі краплі. <b>Рішення — жовч</b>: як засіб для миття посуду, дробить краплі на дрібні (<b>емульгування</b>).</p>
<div class="box">Жовч жир <b>НЕ розщеплює</b>, лише дрібнить. Ріже — <b>ліпаза підшлункової</b>.</div>
<p>Продукти всмоктуються, у клітинах кишки <b>знову збираються в жир</b>, пакуються в «кораблики» — <b>хіломікрони</b> — і йдуть <b>у лімфу</b> (а не у ворітну вену).</p>
<div class="box clin"><b>Стеаторея.</b> Немає жовчі (камінь, пухлина) або ліпази (хронічний панкреатит) → жирний, блискучий кал, що погано змивається; втрачаються вітаміни <b>A, D, E, K</b> (нестача K → кровоточивість).</div>
<h2>6. Білки → амінокислоти</h2>
<p>Білок — <b>ланцюжок амінокислот</b> (20 видів), з'єднаних <b>пептидними зв'язками</b>, як потяг із вагонів.</p>
<ol><li><b>Шлунок:</b> HCl <b>розплутує</b> білок (денатурація) і <b>вмикає пепсин</b> (пепсиноген → пепсин).</li>
<li><b>12-пала кишка:</b> трипсин, хімотрипсин, карбоксипептидаза підшлункової.</li>
<li><b>Тонка кишка:</b> пептидази облямівки → вільні амінокислоти → ворітна вена → печінка.</li></ol>
<p>Підшлункова сама себе не перетравлює, бо виробляє протеази <b>неактивними</b> (трипсиноген) — «ножиці в чохлі». Чохол знімає <b>ентеропептидаза</b> кишки.</p>
<div class="box clin"><b>Гострий панкреатит.</b> Ферменти вмикаються зарано, в самій залозі (алкоголь, камінь) → залоза перетравлює себе. Оперізуючий біль, у крові ↑ <b>амілаза і ліпаза</b>.</div>
<h2>7. НК → пентози, азотисті основи, H₃PO₄</h2>
<p>Нуклеотид = <b>пентоза</b> (C5: рибоза/дезоксирибоза) + <b>азотиста основа</b> (А, Г, Ц, Т, У) + <b>фосфорна кислота</b>. Нуклеази підшлункової ріжуть ДНК/РНК на нуклеотиди, ферменти кишки — на ці три частини. Стрілка від НК вгору — синтез своїх ДНК/РНК.</p>
<h2>8. Підсумок</h2>
<table><tr><th>Їли</th><th>«Ножиці»</th><th>Отримали</th><th>Куди</th></tr>
<tr><td>Вуглеводи</td><td>амілази, мальтаза, сахараза, лактаза</td><td>глюкоза</td><td>ворітна вена → печінка</td></tr>
<tr><td>Жири</td><td>ліпаза (+жовч)</td><td>гліцерин + ЖК</td><td>хіломікрони → <b>лімфа</b></td></tr>

<tr><td>НК</td><td>нуклеази</td><td>пентози + основи + H₃PO₄</td><td>ворітна вена → печінка</td></tr></table>

{ n:3, title:'Гліколіз: глюкоза → піруват', time:'~30 хв', html:`
<div class="box"><b>Де ми на схемі:</b> стрілка «гліколіз» від <b>Глюкози (C6)</b> вниз до <b>Пірувату (C3)</b>, збоку — <b>АТФ</b> і <b>НАД·Н</b>.</div>
<h2>1. Що це простими словами</h2>
<p><b>Гліколіз</b> (гліко — солодкий, лізис — розщеплення) — це <b>розпилювання колоди глюкози (C6) навпіл на дві половинки — 2 молекули пірувату (C3)</b>. По дорозі клітина заробляє трохи АТФ і завантажує «вантажівки» НАД·Н.</p>
<ul><li>Де: у <b>цитоплазмі</b> (не в мітохондріях!).</li>
<li>Кисень <b>не потрібен</b> — тому гліколіз працює навіть при гіпоксії.</li>
<li>Відбувається майже в <b>усіх клітинах</b> тіла.</li></ul>
<h2>2. Як глюкоза потрапляє в клітину</h2>
<p>Глюкоза сама через мембрану не проходить — їй потрібні «двері» — білки-переносники <b>GLUT</b>. У м'язах і жировій тканині двері <b>GLUT4</b> відчиняє <b>інсулін</b> (як ключ). У мозку, печінці, еритроцитах двері відчинені завжди — інсулін не потрібен.</p>
<div class="box clin">При цукровому діабеті інсуліну мало (або на нього не реагують) — двері в м'язах і жирі зачинені, глюкоза «стоїть на вулиці» в крові → гіперглікемія.</div>
<h2>3. Дві фази: «вклади» і «заробити»</h2>
<div class="flow">
<div class="floor"><b>Фаза 1 — інвестиції (витрачаємо 2 АТФ).</b><br>Глюкоза отримує фосфат → <b>глюкозо-6-фосфат</b> (фермент <b>гексокіназа</b>). Тепер глюкоза «заперта» в клітині — з фосфатом вона не вийде назад. Ще один фосфат вішає <b>фосфофруктокіназа-1 (ФФК-1)</b> — <b>головний кран гліколізу</b>. Утворюється фруктозо-1,6-бісфосфат (C6).</div>
<div class="arrow">↓ розпил навпіл</div>

<div class="arrow">↓</div>
<div class="floor"><b>Фаза 2 — прибуток (для кожної з двох половинок).</b><br>Кожна C3 дає <b>1 НАД·Н</b> і <b>2 АТФ</b>. Передостання речовина — <b>фосфоенолпіруват (ФЕП)</b> (є на схемі!), останній фермент — <b>піруваткіназа</b> → <b>піруват</b>.</div></div>
<h2>4. Рахуємо прибуток</h2>
<table><tr><th></th><th>Витратили</th><th>Отримали</th><th>Чистий результат</th></tr>

<div class="box mn">Запам'ятай: <b>1 глюкоза → 2 пірувати + 2 АТФ + 2 НАД·Н</b>. «Два-два-два».</div>
<p>2 АТФ — це мало (повне спалювання глюкози дає ~30–32). Але гліколіз <b>швидкий</b> і <b>не потребує кисню</b> — це «аварійний генератор».</p>
<h2>5. Три «односторонні двері»</h2>
<p>Більшість кроків гліколізу можна прокрутити назад, але три — <b>незворотні</b> (як турнікет у метро):</p>

<h2>6. Куди йде піруват? Залежить від кисню</h2>
<table><tr><th>Кисень є (аеробно)</th><th>Кисню немає (анаеробно)</th></tr>
<tr><td>Піруват іде в <b>мітохондрію</b> → ацетил-КоА → ЦТК → ЦПЕ → багато АТФ</td><td>Піруват → <b>лактат</b> (молочна кислота) у цитоплазмі</td></tr></table>

<div class="box"><b>Еритроцити</b> не мають мітохондрій — вони живуть <b>тільки на гліколізі</b> і завжди утворюють лактат. Його забирає печінка й робить назад глюкозу (цикл Корі — тема 7).</div>
<h2>7. Регуляція: коли гліколіз пришвидшується</h2>
<ul><li><b>Багато АТФ</b> («гаманець повний») → ФФК-1 гальмується.</li>
<li><b>Мало АТФ, багато АМФ</b> («гроші закінчились») → ФФК-1 пришвидшується.</li>
<li><b>Інсулін</b> (після їжі) — пришвидшує; <b>глюкагон</b> (голод) — гальмує гліколіз у печінці.</li></ul>
<div class="box clin"><b>Клініка.</b>
<ul><li><b>Лактат-ацидоз</b>: при шоці, сепсисі, тяжкій серцевій недостатності тканинам бракує кисню → масово працює анаеробний гліколіз → лактат у крові ↑ (маркер тяжкості шоку).</li>
<li><b>Дефіцит піруваткінази</b>: еритроцити не мають АТФ → руйнуються → гемолітична анемія.</li>
<li>Пухлинні клітини посилено «їдять» глюкозу гліколізом (ефект Варбурга) — на цьому працює ПЕТ-КТ з міченою глюкозою.</li></ul></div>

<h2>1. Розшифровуємо страшну назву</h2>
<table><tr><th>Слово</th><th>Що означає</th></tr>

<div class="box mn">Піруват (C3) + КоА + НАД → <b>Ацетил-КоА (C2)</b> + <b>CO₂</b> + <b>НАД·Н</b></div>
<h2>2. Де і хто це робить</h2>
<p>Піруват, утворений у цитоплазмі, <b>заходить у мітохондрію</b>. Там на нього чекає величезний «верстат» — <b>піруватдегідрогеназний комплекс (ПДК)</b>: три ферменти, зібрані в одну машину, як конвеєр на заводі.</p>
<h3>Ацетил-КоА — що це таке?</h3>
<p><b>Ацетил</b> — це шматочок з 2 вуглеців (C2). <b>КоА (коензим А)</b> — «ручка», за яку ацетил тримають і переносять. Як ящик з ручкою: сам ацетил «незручний», а з КоА його легко передати в ЦТК.</p>

<tr><td>Ліпоєва кислота</td><td>(вітаміноподібна речовина)</td></tr>
<tr><td>Коензим А (КоА)</td><td><b>B5 (пантотенова кислота)</b></td></tr>
<tr><td>ФАД</td><td><b>B2 (рибофлавін)</b></td></tr>
<tr><td>НАД</td><td><b>B3 (ніацин, PP)</b></td></tr></table>
<div class="box mn"><b>Мнемоніка:</b> «<b>Т</b>и <b>Л</b>ікар — <b>К</b>овтай <b>Ф</b>рукти <b>Н</b>аполегливо» = ТПФ, Ліпоєва, КоА, ФАД, НАД.</div>
<h2>4. Двері, що відчиняються тільки в один бік</h2>
<p>Ця реакція <b>незворотна</b>. З ацетил-КоА піруват назад не зробиш. Наслідок дуже важливий:</p>
<div class="box warn">Жирні кислоти розпадаються до ацетил-КоА. Оскільки з ацетил-КоА не можна повернутися до пірувату, <b>з жирних кислот людина НЕ може синтезувати глюкозу</b>. Тому при тривалому голоді мозок не може «харчуватися жиром» напряму, і організм розбирає білки м'язів на глюкозу (або переходить на кетонові тіла — тема 9).</div>
<h2>5. Регуляція: коли ПДК вмикається</h2>
<ul><li><b>Після їжі</b> (інсулін) — ПДК активний: «є глюкоза — спалюймо або запасаймо у вигляді жиру».</li>
<li><b>Багато АТФ, НАД·Н, ацетил-КоА</b> (наприклад, під час голоду, коли спалюються жири) — ПДК гальмується: «енергії й так вистачає, глюкозу бережемо для мозку».</li></ul>
<h2>6. Рахунок на одну глюкозу</h2>
<p>З глюкози утворилось <b>2 пірувати</b>, тож ця реакція йде двічі: <b>2 ацетил-КоА + 2 CO₂ + 2 НАД·Н</b>.</p>

{ n:5, title:'Цикл Кребса (ЦТК)', time:'~35 хв', html:`
<div class="box"><b>Де ми на схемі:</b> велике коло посередині — «ЦТК (цикл Кребса)» з речовинами по колу: цитрат, ізоцитрат, α-кетоглутарат, сукциніл-КоА, сукцинат, фумарат, малат, оксалоацетат (ЩУК).</div>
<h2>1. Що це простими словами</h2>
<p><b>ЦТК (цикл трикарбонових кислот, цикл Кребса)</b> — це «каруселька» в мітохондрії, яка <b>добиває ацетил (C2) до двох CO₂</b> і при цьому <b>завантажує багато «вантажівок» НАД·Н і ФАД·Н₂</b> для ЦПЕ.</p>
<p><b>Аналогія — карусель із сидінням.</b> Сидіння — це <b>оксалоацетат (C4)</b>. Пасажир — <b>ацетил (C2)</b>. Пасажир сідає → сидіння з пасажиром робить коло → по дорозі пасажира «розбирають» (2 CO₂ відлітають, водень забирають вантажівки) → <b>сидіння повертається порожнім</b> і готове взяти нового пасажира.</p>
<div class="box">Тому оксалоацетат в циклі <b>не витрачається</b> — він як каталізатор. Але якщо його мало, «сідати» нікуди, і цикл гальмує.</div>
<h2>2. Коло крок за кроком (рахуй вуглеці!)</h2>
<table><tr><th>№</th><th>Крок</th><th>C</th><th>Що отримали</th></tr>

<tr><td>6</td><td>Сукцинат → <b>фумарат</b> (сукцинатдегідрогеназа)</td><td>C4</td><td><b>ФАД·Н₂</b></td></tr>

<tr><td>8</td><td>Малат → <b>оксалоацетат</b></td><td>C4</td><td><b>НАД·Н</b></td></tr></table>
<div class="box mn"><b>Мнемоніка порядку:</b> «<b>Ц</b>і <b>І</b>деї <b>К</b>ращі <b>С</b>усідам: <b>С</b>ам <b>Ф</b>ілософ <b>М</b>овчки <b>О</b>цінив» = Цитрат, Ізоцитрат, α-Кетоглутарат, Сукциніл-КоА, Сукцинат, Фумарат, Малат, Оксалоацетат.</div>
<p>Подивись на схему: CO₂ відлітає саме біля <b>ізоцитрату → α-кетоглутарату</b> і <b>α-кетоглутарату → сукциніл-КоА</b>. C6 → C5 → C4. Усе сходиться!</p>
<h2>3. «Врожай» одного оберту</h2>
<table><tr><th>Що</th><th>За 1 оберт</th><th>За 1 глюкозу (2 оберти)</th></tr>
<tr><td>CO₂</td><td>2</td><td>4</td></tr><tr><td>НАД·Н</td><td>3</td><td>6</td></tr>
<tr><td>ФАД·Н₂</td><td>1</td><td>2</td></tr><tr><td>ГТФ (≈АТФ)</td><td>1</td><td>2</td></tr></table>
<div class="box mn">«<b>3-1-1</b>»: 3 НАД·Н, 1 ФАД·Н₂, 1 ГТФ за оберт. Плюс 2 CO₂.</div>
<p>Сам ЦТК майже не дає АТФ напряму. Його головна робота — <b>завантажити вантажівки</b>. Справжні гроші — потім, у ЦПЕ.</p>
<h2>4. ЦТК — не лише «піч», а й «вокзал»</h2>
<p>Подивись на праву частину схеми: від <b>α-кетоглутарату</b> і <b>сукциніл-КоА</b> йдуть стрілки до <b>α-кетокислот</b> і <b>амінокислот</b>. А від <b>оксалоацетату</b> стрілка йде вгору — до <b>фосфоенолпірувату</b> і глюкози.</p>
<ul><li>Амінокислоти можуть <b>входити</b> в цикл (глутамат → α-кетоглутарат, аспартат → оксалоацетат).</li>
<li>Речовини циклу можна <b>забирати</b> на синтез: оксалоацетат → глюкоза (глюконеогенез), цитрат → жирні кислоти, сукциніл-КоА → гем гемоглобіну.</li></ul>
<p>Тому ЦТК називають <b>амфіболічним</b> (і розпад, і синтез) — це центральна розв'язка метаболізму.</p>
<h2>5. Регуляція</h2>
<ul><li>Багато <b>АТФ і НАД·Н</b> → цикл гальмує («склад повний»).</li>
<li>Багато <b>АДФ</b> → цикл пришвидшується.</li>
<li><b>Без кисню</b> ЦПЕ не розвантажує НАД·Н → порожнього НАД немає → цикл <b>зупиняється</b>, хоч сам кисню не використовує.</li></ul>
<div class="box clin"><b>Клініка.</b>
<ul><li><b>Гіпоксія</b> зупиняє ЦТК — ось чому без кисню різко падає вироблення АТФ.</li>
<li>Для кроку α-кетоглутарат → сукциніл-КоА потрібні ті самі коферменти, що й для ПДК, включно з <b>B1</b>. Тому при дефіциті тіаміну страждає і ЦТК.</li>
<li><b>Кетоз</b>: при голоді й декомпенсованому діабеті печінка забирає оксалоацетат на глюконеогенез. Сидінь на каруселі мало → ацетил-КоА не може сісти → печінка робить з нього <b>кетонові тіла</b> (тема 9).</li></ul></div>

{ n:6, title:'Дихальний ланцюг (ЦПЕ) і синтез АТФ', time:'~35 хв', html:`
<div class="box"><b>Де ми на схемі:</b> самий низ — <b>НАД·Н, ФАД·Н₂ → Q → ЦПЕ</b>, з'являються <b>O₂ → H₂O</b> і <b>АДФ + Ф → АТФ</b>.</div>
<h2>1. Що це простими словами</h2>
<p><b>ЦПЕ (ланцюг переносу електронів, дихальний ланцюг)</b> — «електростанція», де вантажівки НАД·Н і ФАД·Н₂ <b>розвантажуються</b>, а енергія їхнього вантажу перетворюється на <b>АТФ</b>. Тут утворюється <b>понад 90 % усього АТФ</b>.</p>
<p>Де: <b>внутрішня мембрана мітохондрії</b> (складена в складки — <b>кристи</b>, щоб було більше місця для «турбін»).</p>
<h2>2. Аналогія — гідроелектростанція</h2>
<div class="flow">
<div class="floor"><b>1. Вода падає з висоти.</b> Електрони від НАД·Н «скочуються» по ланцюжку білків-комплексів, віддаючи енергію порціями.</div><div class="arrow">↓</div>
<div class="floor"><b>2. Насоси качають воду за греблю.</b> За рахунок цієї енергії комплекси <b>викачують протони (H⁺)</b> з матриксу в простір між мембранами. Там накопичується «тиск» протонів — як вода за греблею.</div><div class="arrow">↓</div>
<div class="floor"><b>3. Вода крутить турбіну.</b> Протони прагнуть назад і можуть пройти тільки через «турбіну» — фермент <b>АТФ-синтазу</b>. Вона крутиться і робить <b>АДФ + Ф → АТФ</b>.</div><div class="arrow">↓</div>
<div class="floor"><b>4. Вода стікає в річку.</b> Електрони в кінці ланцюга забирає <b>кисень</b> → з протонами утворюється <b>вода (H₂O)</b>.</div></div>
<h2>3. Учасники ланцюга</h2>
<table><tr><th>Учасник</th><th>Роль</th><th>Качає H⁺?</th></tr>
<tr><td><b>Комплекс I</b></td><td>приймає електрони від <b>НАД·Н</b></td><td>так</td></tr>
<tr><td><b>Комплекс II</b></td><td>приймає від <b>ФАД·Н₂</b> (це сукцинатдегідрогеназа з ЦТК!)</td><td>ні</td></tr>
<tr><td><b>Q (коензим Q, убіхінон)</b></td><td>«човник» — переносить електрони від I і II до III (на схемі — «Q»)</td><td>—</td></tr>
<tr><td><b>Комплекс III</b></td><td>передає далі</td><td>так</td></tr>
<tr><td><b>Цитохром c</b></td><td>другий «човник» (III → IV)</td><td>—</td></tr>
<tr><td><b>Комплекс IV</b> (цитохромоксидаза)</td><td>віддає електрони <b>кисню</b> → H₂O</td><td>так</td></tr>
<tr><td><b>АТФ-синтаза</b> (комплекс V)</td><td>турбіна: робить АТФ</td><td>пропускає H⁺ назад</td></tr></table>
<h2>4. Чому НАД·Н «дорожчий», ніж ФАД·Н₂</h2>
<p>НАД·Н заходить з самого початку (комплекс I) і проходить через <b>три</b> насоси. ФАД·Н₂ заходить через комплекс II, <b>пропускаючи перший насос</b>.</p>
<table><tr><th></th><th>АТФ (сучасні дані)</th><th>Старі підручники</th></tr>
<tr><td>1 НАД·Н</td><td>≈ 2,5</td><td>3</td></tr><tr><td>1 ФАД·Н₂</td><td>≈ 1,5</td><td>2</td></tr>
<tr><td>1 глюкоза повністю</td><td><b>≈ 30–32</b></td><td>36–38</td></tr></table>
<h2>5. Окисне фосфорилювання = «спряження»</h2>
<p><b>Окиснення</b> (рух електронів до кисню) і <b>фосфорилювання</b> (АДФ + Ф → АТФ) зв'язані протонною «греблею» — <b>спряжені</b>. Якщо пробити дірку в греблі, протони стікатимуть повз турбіну: електрони біжать, кисень витрачається, але <b>АТФ не утворюється, а енергія йде в тепло</b>. Це <b>роз'єднання</b>.</p>
<ul><li><b>Бура жирова тканина</b> (новонароджені) має білок-«дірку» <b>термогенін (UCP1)</b> — гріє дитину.</li>
<li><b>Гормони щитоподібної залози</b> у надлишку частково роз'єднують → гіпертиреоїдні пацієнти гарячі, пітливі, худнуть.</li>
<li><b>2,4-динітрофенол</b> (колись — «таблетки для схуднення») → смертельна гіпертермія.</li></ul>
<h2>6. Отрути дихального ланцюга</h2>
<table><tr><th>Отрута</th><th>Що блокує</th></tr>
<tr><td><b>Ціаніди</b> (дим при пожежі, мигдальні кісточки), <b>чадний газ (CO)</b>, сірководень</td><td>комплекс IV — електрони не можуть потрапити на кисень</td></tr>
<tr><td>Ротенон (пестицид), барбітурати (у великих дозах)</td><td>комплекс I</td></tr>
<tr><td>Олігоміцин (антибіотик, лабораторний)</td><td>АТФ-синтазу</td></tr></table>
<div class="box clin"><b>Клініка.</b>
<ul><li><b>Отруєння ціанідами</b>: кисню в крові достатньо, але клітини його <b>не можуть використати</b> → венозна кров «артеріалізована» (яскраво-червона), тяжкий лактат-ацидоз, кома. Антидот — гідроксокобаламін.</li>
<li><b>Чадний газ</b> б'є двічі: зв'язує гемоглобін (кров не несе O₂) <b>і</b> блокує комплекс IV.</li>
<li>Електрони іноді «витікають» з ланцюга і утворюють <b>активні форми кисню (вільні радикали)</b>, що пошкоджують клітини. Захист — антиоксиданти (глутатіон, якому потрібен НАДФ·Н з пентозофосфатного шляху, тема 8).</li></ul></div>

{ n:7, title:'Глюконеогенез: як зробити глюкозу «з нічого»', time:'~30 хв', html:`
<div class="box"><b>Де ми на схемі:</b> стрілка зліва «глюконеогенез»: <b>Оксалоацетат (ЩУК) → фосфоенолпіруват → Глюкоза</b>, а також <b>Гліцерин ⇄ Глюкоза</b>.</div>
<h2>1. Навіщо це потрібно</h2>
<p>Деякі клітини можуть жити <b>тільки (або майже тільки) на глюкозі</b>: <b>мозок</b> (поки немає кетонових тіл), <b>еритроцити</b>, мозкова речовина нирок. Мозку потрібно ~120 г глюкози на добу.</p>
<p>Запасу глюкози в печінці (<b>глікогену</b>) вистачає лише на <b>12–24 години</b> голоду. Що далі? Печінка (і частково нирки) починає <b>будувати нову глюкозу з неглюкозних речовин</b>. Це і є <b>глюконеогенез</b> («нове утворення глюкози»).</p>
<h2>2. З чого можна зробити глюкозу</h2>
<table><tr><th>Сировина</th><th>Звідки береться</th></tr>
<tr><td><b>Лактат</b></td><td>з м'язів при навантаженні, з еритроцитів</td></tr>
<tr><td><b>Гліцерин</b></td><td>з розпаду жиру (на схемі — Гліцерин → Глюкоза)</td></tr>
<tr><td><b>Глюкогенні амінокислоти</b> (особливо аланін)</td><td>з розпаду білків м'язів</td></tr></table>
<div class="box warn"><b>НЕ можна</b> з жирних кислот (з парною кількістю вуглеців) — бо піруват → ацетил-КоА незворотний (тема 4). Жир дає для глюкози лише свій «гребінець» — гліцерин.</div>
<h2>3. Це не просто гліколіз задом наперед</h2>
<p>Більшість кроків гліколізу зворотні, і глюконеогенез ними користується. Але <b>три турнікети</b> (гексокіназа, ФФК-1, піруваткіназа) назад не пускають. Для них є <b>обхідні шляхи</b>:</p>
<table><tr><th>Турнікет гліколізу</th><th>Обхід у глюконеогенезі</th></tr>
<tr><td>Піруваткіназа (ФЕП → піруват)</td><td><b>Піруват → оксалоацетат</b> (піруваткарбоксилаза, потрібен <b>біотин B7</b>, у мітохондрії) → <b>фосфоенолпіруват</b> (ФЕП-карбоксикіназа). <i>Саме це і намальовано на схемі: ЩУК → ФЕП ↑</i></td></tr>
<tr><td>ФФК-1</td><td><b>Фруктозо-1,6-бісфосфатаза</b></td></tr>
<tr><td>Гексокіназа</td><td><b>Глюкозо-6-фосфатаза</b> — знімає фосфат, і глюкоза може <b>вийти в кров</b></td></tr></table>
<div class="box"><b>Глюкозо-6-фосфатаза є тільки в печінці і нирках.</b> Тому лише вони можуть віддавати глюкозу в кров. М'язи мають свій глікоген, але «ділитися» не можуть — він тільки для них самих.</div>
<h2>4. Ціна</h2>
<p>Будувати дорожче, ніж ламати: на 1 глюкозу витрачається <b>6 «енергетичних монет»</b> (4 АТФ + 2 ГТФ), тоді як гліколіз давав лише 2 АТФ. Енергію для глюконеогенезу печінка бере з <b>β-окиснення жирних кислот</b>.</p>
<h2>5. Цикли «обміну» між органами</h2>
<div class="flow">
<div class="floor"><b>Цикл Корі (лактатний):</b> м'яз працює → глюкоза → <b>лактат</b> → кров → печінка → <b>глюкоза</b> → кров → м'яз.</div>
<div class="floor"><b>Глюкозо-аланіновий цикл:</b> м'яз → <b>аланін</b> (несе і вуглецевий скелет, і азот) → печінка → глюкоза (а азот — у сечовину).</div></div>
<h2>6. Регуляція: гормони «голоду» проти гормону «ситості»</h2>
<table><tr><th>Вмикають глюконеогенез</th><th>Вимикає</th></tr>
<tr><td><b>Глюкагон</b> (голод), <b>кортизол</b> (стрес), адреналін</td><td><b>Інсулін</b> (після їжі)</td></tr></table>
<p>Гліколіз і глюконеогенез регулюються <b>протилежно</b>, щоб не працювати одночасно (інакше клітина марно палила б АТФ — «марний цикл»).</p>
<div class="box clin"><b>Клініка.</b>
<ul><li><b>Метформін</b> — головний препарат при діабеті 2 типу — знижує цукор передусім тим, що <b>гальмує глюконеогенез у печінці</b>.</li>
<li><b>Алкоголь</b> гальмує глюконеогенез (надлишок НАД·Н). Людина, що випила і не їла (глікоген вичерпано) → <b>тяжка гіпоглікемія</b>, яку легко сплутати зі сп'янінням.</li>
<li><b>Кортикостероїди</b> посилюють глюконеогенез → <b>стероїдний діабет</b>, гіперглікемія в пацієнтів на преднізолоні.</li>
<li>При декомпенсованому діабеті печінка постійно «думає», що голод → безперервний глюконеогенез → гіперглікемія натщесерце.</li>
<li><b>Хвороба Гірке</b> (дефіцит глюкозо-6-фосфатази): печінка не віддає глюкозу → важкі гіпоглікемії в дітей, збільшена печінка.</li></ul></div>

{ n:9, title:'Жирні кислоти: β-окиснення і біосинтез', time:'~35 хв', html:`
<div class="box"><b>Де ми на схемі:</b> ліворуч дві паралельні стрілки між <b>Жирними кислотами (ЖК)</b> і <b>Ацетил-КоА (C2)</b>: вниз — «β-окиснення ЖК», вгору — «біосинтез ЖК».</div>
<h2>1. Жирна кислота — що це</h2>
<p>Це <b>довгий ланцюжок вуглеців</b> (наприклад, пальмітинова кислота — <b>C16</b>), обвішаний воднями. Думай про неї як про <b>довгу ковбасу</b>.</p>
<p>Жир — <b>найвигідніше паливо</b>: 1 г жиру = <b>9 ккал</b>, 1 г вуглеводів чи білків = 4 ккал. Звичайна людина має запас жиру на ~1–2 місяці голоду, а глікогену — на добу.</p>
<h2>2. β-окиснення — нарізаємо ковбасу</h2>
<h3>Крок 0. Дістати жир зі складу (ліполіз)</h3>
<p>У жировій тканині <b>гормон-чутлива ліпаза</b> розщеплює запасний жир на гліцерин + жирні кислоти. Її <b>вмикають глюкагон і адреналін</b> (голод, стрес, навантаження), <b>вимикає інсулін</b>. Жирні кислоти їдуть кров'ю, «зачепившись» за <b>альбумін</b>.</p>
<h3>Крок 1. Активація</h3>
<p>У цитоплазмі клітини до жирної кислоти чіпляють <b>КоА</b> (ту саму «ручку») → ацил-КоА. Коштує АТФ — «вхідний квиток».</p>
<h3>Крок 2. Ліфт у мітохондрію — карнітин</h3>
<p>Довгі жирні кислоти не проходять у мітохондрію самі. Їх перевозить <b>карнітин</b> — «ліфт» (карнітиновий човник). Це <b>головна точка контролю</b>: коли клітина синтезує жир, речовина малоніл-КоА <b>блокує ліфт</b> — щоб не спалювати те, що щойно збудували.</p>
<h3>Крок 3. Нарізання по C2</h3>
<p>У мітохондрії від ковбаси раз за разом відрізається шматочок <b>C2 = ацетил-КоА</b>. Кожен «розріз» (4 реакції; окиснюється β-вуглець, звідси назва) дає:</p>
<div class="box mn">Один оберт β-окиснення: <b>1 ацетил-КоА + 1 ФАД·Н₂ + 1 НАД·Н</b>, ковбаса коротша на C2.</div>
<table><tr><th>Пальмітинова кислота C16</th><th></th></tr>
<tr><td>Обертів (розрізів)</td><td><b>7</b> (останній розріз дає 2 шматки)</td></tr>
<tr><td>Ацетил-КоА</td><td><b>8</b> → у ЦТК</td></tr>
<tr><td>ФАД·Н₂ / НАД·Н</td><td>7 / 7</td></tr>
<tr><td>Разом АТФ</td><td><b>≈ 106</b> (глюкоза — лише ~30!)</td></tr></table>
<h2>3. Кетонові тіла — «жир для мозку»</h2>
<p>Мозок <b>не може</b> використовувати жирні кислоти напряму (вони не проходять гематоенцефалічний бар'єр). При тривалому голоді або нестачі інсуліну печінка має <b>забагато ацетил-КоА</b>, а оксалоацетату (сидінь каруселі ЦТК) мало — він іде на глюконеогенез. Тоді печінка перетворює ацетил-КоА на <b>кетонові тіла</b>:</p>
<ul><li><b>ацетоацетат</b>, <b>β-гідроксибутират</b> — паливо для мозку, серця, м'язів;</li><li><b>ацетон</b> — видихається (запах «моченого яблука»).</li></ul>
<p>Самі печінкові клітини кетони <b>не використовують</b> — вони «експортний продукт».</p>
<h2>4. Біосинтез жирних кислот — будуємо ковбасу</h2>
<p>Коли їжі (особливо вуглеводів) <b>більше, ніж треба</b>, інсулін вмикає синтез жиру — «на чорний день». Це <b>не</b> β-окиснення задом наперед, а інша фабрика:</p>
<table><tr><th></th><th>β-окиснення (розпад)</th><th>Біосинтез</th></tr>
<tr><td>Де</td><td>мітохондрія</td><td><b>цитоплазма</b> (печінка, жирова тканина)</td></tr>
<tr><td>Гормон</td><td>глюкагон, адреналін</td><td><b>інсулін</b></td></tr>
<tr><td>«Вантажівки»</td><td>віддає водень на ФАД, НАД</td><td>бере водень з <b>НАДФ·Н</b> (з ПФШ!)</td></tr>
<tr><td>Крок</td><td>відрізає по C2</td><td>додає по C2 (через малоніл-КоА)</td></tr>
<tr><td>Ключовий фермент</td><td>карнітиновий човник</td><td><b>ацетил-КоА-карбоксилаза</b> (біотин) → малоніл-КоА</td></tr></table>
<p>Ацетил-КоА утворюється в мітохондрії, а синтез іде в цитоплазмі. Як його вивезти? У вигляді <b>цитрату</b> (з ЦТК!) — цитрат виходить і в цитоплазмі знову розпадається на ацетил-КоА. Фабрика <b>синтаза жирних кислот</b> нарощує ланцюг по C2 до <b>пальмітату C16</b>. Потім з гліцерином → запасний жир (ТАГ).</p>
<div class="box warn"><b>Головний висновок:</b> з надлишку цукру організм <b>робить жир</b> (глюкоза → піруват → ацетил-КоА → ЖК). А з жиру глюкозу — <b>ні</b>. Дорога в один бік.</div>
<div class="box clin"><b>Клініка.</b>
<ul><li><b>Діабетичний кетоацидоз (ДКА)</b>: при цукровому діабеті 1 типу без інсуліну — некерований ліполіз + β-окиснення → масове утворення кетонів (це кислоти) → ацидоз. Ознаки: глибоке шумне дихання (<b>Куссмауля</b>), запах ацетону, блювання, біль у животі, зневоднення, гіперглікемія.</li>
<li><b>Голодовий кетоз</b> і кето-дієта — помірний кетоз без ацидозу (інсулін хоч трохи є).</li>
<li><b>Дефіцит карнітину</b> або ферментів β-окиснення (напр., MCAD — в неонатальному скринінгу): при голоді — <b>гіпоглікемія без кетонів</b>, слабкість м'язів, кардіоміопатія.</li>
<li>Надлишок вуглеводів і алкоголю → синтез жиру в печінці → <b>жирова хвороба печінки</b>.</li></ul></div>

{ n:10, title:'Амінокислоти: переамінування, дезамінування, цикл сечовини', time:'~35 хв', html:`
<div class="box"><b>Де ми на схемі:</b> права частина — <b>α-амінокислоти</b>, стрілки «переамінування» і «дезамінування» до пірувату й α-кетоглутарату, <b>α-кетокислоти</b>, <b>Глутамін → Цикл сечовини → Сеча</b>.</div>
<h2>1. Амінокислота = скелет + «азотна шапка»</h2>
<p>Кожна амінокислота має дві частини:</p>
<ul><li><b>Аміногрупа (–NH₂)</b> — містить <b>азот</b>. Це «шапка».</li>
<li><b>Вуглецевий скелет</b> — без шапки це <b>α-кетокислота</b>.</li></ul>
<p>Запасу амінокислот в організмі <b>немає</b> (на відміну від жиру і глікогену). Що не пішло на білки — розбирається: скелет — на енергію або глюкозу, азот — геть з організму.</p>
<h2>2. Переамінування (трансамінування) — передати шапку</h2>
<p>Амінокислота <b>передає свою шапку (NH₂)</b> на α-кетокислоту. Перша стає кетокислотою, друга — новою амінокислотою. Як передати шапку сусіду.</p>
<div class="box mn">Амінокислота + <b>α-кетоглутарат</b> ⇄ α-кетокислота + <b>глутамат</b></div>
<ul><li>Найчастіше шапку отримує <b>α-кетоглутарат</b> (з ЦТК) → стає <b>глутаматом</b>. Глутамат — «збирач азоту».</li>
<li>Ферменти — <b>амінотрансферази</b>; кофермент — <b>вітамін B6</b> (піридоксальфосфат).</li>
<li>Найважливіші пари: <b>АЛТ</b>: аланін ⇄ <b>піруват</b>; <b>АСТ</b>: аспартат ⇄ <b>оксалоацетат</b>. Ось чому на схемі стрілки переамінування йдуть до пірувату і до ЦТК.</li>
<li>Так організм робить <b>замінні</b> амінокислоти з кетокислот. <b>Незамінні</b> (9: валін, лейцин, ізолейцин, треонін, метіонін, лізин, фенілаланін, триптофан, гістидин) — тільки з їжею.</li></ul>
<h2>3. Дезамінування — зняти шапку зовсім</h2>
<p>Глутамат у печінці <b>знімає шапку</b> (фермент глутаматдегідрогеназа) → вільний <b>аміак (NH₃)</b> + α-кетоглутарат (повертається в гру).</p>
<div class="box warn"><b>Аміак — дуже токсичний для мозку.</b> Навіть невелике підвищення викликає сплутаність, сонливість, кому.</div>
<h2>4. Безпечне транспортування азоту</h2>
<p>Тканини не можуть просто викинути аміак у кров. Вони пакують його в «безпечні контейнери»:</p>
<ul><li><b>Глутамін</b> (глутамат + ще один NH₃) — головний «контейнер» із більшості тканин (у мозку — головний спосіб знешкодження). Везе азот у печінку й нирки. <i>На схемі — «Глутамін»</i>.</li>
<li><b>Аланін</b> — із м'язів (глюкозо-аланіновий цикл, тема 7).</li></ul>
<h2>5. Цикл сечовини — «завод з утилізації» в печінці</h2>
<p>Печінка перетворює токсичний аміак на <b>сечовину</b> — нетоксичну, добре розчинну у воді речовину, яку <b>нирки виводять із сечею</b>.</p>
<div class="box mn">2 NH₃ (один — через аспартат) + CO₂ + енергія (3 АТФ) → <b>сечовина</b> → кров → нирки → <b>сеча</b></div>
<p>Частина циклу відбувається в мітохондрії, частина — в цитоплазмі. Цикл сечовини пов'язаний з ЦТК через <b>фумарат</b> і <b>аспартат</b> («велосипед Кребса» — два кола, з'єднані разом).</p>
<h2>6. Що буде зі скелетом</h2>
<table><tr><th>Тип</th><th>Скелет перетворюється на</th><th>Може дати</th></tr>
<tr><td><b>Глюкогенні</b> (більшість)</td><td>піруват, оксалоацетат, α-кетоглутарат, сукциніл-КоА, фумарат</td><td>глюкозу (глюконеогенез) або енергію</td></tr>
<tr><td><b>Кетогенні</b> (лейцин, лізин)</td><td>ацетил-КоА</td><td>кетонові тіла, жир, енергію — але не глюкозу</td></tr></table>
<div class="box clin"><b>Клініка.</b>
<ul><li><b>АЛТ і АСТ</b> — ферменти всередині клітин. Коли клітини руйнуються, вони виходять у кров. <b>АЛТ</b> — переважно печінка (маркер гепатиту, НАЖХП); <b>АСТ</b> — печінка, серце, м'язи. <b>АСТ/АЛТ > 2</b> — характерно для алкогольного ураження печінки.</li>
<li><b>Печінкова енцефалопатія</b> (цироз): печінка не знешкоджує аміак → сплутаність, «хлопаючий» тремор (астериксис). Лікування — <b>лактулоза</b> (зв'язує аміак у кишці) і рифаксимін.</li>
<li><b>Сечовина в крові</b>: ↑ — при нирковій недостатності (не виводиться) і зневодненні; ↓ — при тяжкій печінковій недостатності (не утворюється).</li>
<li><b>Фенілкетонурія</b>: дефіцит ферменту, що перетворює фенілаланін на тирозин → фенілаланін накопичується і пошкоджує мозок. Виявляється неонатальним скринінгом, лікується дієтою.</li>
<li><b>Дефіцит B6</b> (ізоніазид при лікуванні туберкульозу!) → порушене переамінування, полінейропатія. Тому до ізоніазиду призначають B6.</li></ul></div>

{ n:11, title:'Нуклеїнові кислоти: синтез і розпад нуклеотидів', time:'~30 хв', html:`
<div class="box"><b>Де ми на схемі:</b> верхній правий кут — <b>НК</b>, стрілки від <b>H₃PO₄</b>, <b>азотистих основ</b> і <b>пентоз (C5)</b>. Вниз — гідроліз, вгору — синтез.</div>
<h2>1. Згадаймо будову</h2>
<p>Нуклеотид = <b>пентоза</b> (рибоза в РНК / дезоксирибоза в ДНК) + <b>азотиста основа</b> + <b>фосфат</b>. Нуклеотиди — не тільки «букви» ДНК і РНК, а й <b>АТФ, ГТФ, НАД, ФАД, КоА</b>!</p>
<table><tr><th>Група основ</th><th>Які</th><th>Будова</th></tr>
<tr><td><b>Пурини</b></td><td><b>А</b>денін, <b>Г</b>уанін</td><td>два кільця (великі)</td></tr>
<tr><td><b>Піримідини</b></td><td><b>Ц</b>итозин, <b>Т</b>імін (ДНК), <b>У</b>рацил (РНК)</td><td>одне кільце (малі)</td></tr></table>
<div class="box mn"><b>Мнемоніка:</b> «<b>ПУР</b>ини — <b>АГ</b>а, дві хати» (А, Г, два кільця). Решта — піримідини.</div>
<h2>2. Синтез нуклеотидів — два способи</h2>
<h3>Спосіб 1: з нуля (de novo)</h3>
<p>Як будувати будинок з цеглин. Потрібні:</p>
<ul><li><b>Рибоза-5-фосфат</b> з пентозофосфатного шляху (активована форма — ФРПФ) — фундамент;</li>
<li>амінокислоти — <b>глутамін, аспартат, гліцин</b> (дають азот);</li>
<li>CO₂ і <b>«одновуглецеві шматочки» від фолієвої кислоти (B9)</b>.</li></ul>
<p>Для ДНК рибоза перетворюється на <b>дезоксирибозу</b> (фермент рибонуклеотидредуктаза), а урацил — на <b>тимін</b> (фермент тимідилатсинтаза, потрібні <b>фолат</b> і опосередковано <b>B12</b>).</p>
<h3>Спосіб 2: повторне використання (шлях «порятунку»)</h3>
<p>Як ремонт старого будинку: готові основи з розпаду повторно чіпляються до рибози (фермент для пуринів — ГГФРТ). Дешевше і швидше.</p>
<h2>3. Чому це важливо в медицині — ліки</h2>
<p>Клітини, що швидко діляться (пухлини, кістковий мозок, імунні клітини), потребують багато нуклеотидів. Тому багато ліків <b>блокують синтез нуклеотидів</b>:</p>
<table><tr><th>Препарат</th><th>Що блокує</th><th>Застосування</th></tr>
<tr><td><b>Метотрексат</b></td><td>відновлення фолату (дигідрофолатредуктаза)</td><td>пухлини, <b>ревматоїдний артрит</b>, псоріаз</td></tr>
<tr><td>5-фторурацил</td><td>тимідилатсинтазу</td><td>рак кишки</td></tr>
<tr><td>Гідроксисечовина</td><td>рибонуклеотидредуктазу</td><td>мієлопроліферативні хвороби, серпоподібна анемія</td></tr>
<tr><td>Триметоприм</td><td>бактеріальну дигідрофолатредуктазу</td><td>інфекції сечових шляхів (ко-тримоксазол)</td></tr></table>
<div class="box clin"><b>Дефіцит фолату або B12</b> → порушується синтез тиміну → клітини кісткового мозку не можуть нормально подвоїти ДНК, ростуть, але не діляться → <b>мегалобластна (макроцитарна) анемія</b>. Тому вагітним — фолієва кислота, а при метотрексаті — фолієва кислота як «захист».</div>
<h2>4. Розпад нуклеотидів</h2>
<table><tr><th>Що</th><th>Кінцевий продукт</th><th>Проблеми</th></tr>
<tr><td><b>Пурини</b> (А, Г)</td><td>гіпоксантин → ксантин → <b>сечова кислота</b> (фермент <b>ксантиноксидаза</b>)</td><td>сечова кислота погано розчинна → кристали</td></tr>
<tr><td><b>Піримідини</b> (Ц, Т, У)</td><td>CO₂, NH₃, β-аланін — розчинні</td><td>практично немає</td></tr></table>
<p>У більшості тварин є фермент, що розщеплює сечову кислоту далі, а в <b>людини — ні</b>. Тому сечова кислота — наш кінцевий продукт, і вона виводиться нирками.</p>
<div class="box clin"><b>Клініка — подагра.</b>
<ul><li>Сечової кислоти в крові забагато (гіперурикемія) → кристали <b>урату натрію</b> відкладаються в суглобі → <b>раптовий, дуже сильний біль, набряк, почервоніння</b> — класично <b>великий палець стопи</b>, часто вночі.</li>
<li>Причини: <b>м'ясо, субпродукти, морепродукти, пиво, алкоголь, солодкі напої з фруктозою</b>, ожиріння, <b>діуретики</b> (тіазиди, фуросемід), ниркова недостатність; масовий розпад клітин (хіміотерапія пухлин — <b>синдром лізису пухлини</b>).</li>
<li>Лікування довгострокове: <b>алопуринол, фебуксостат</b> — блокують ксантиноксидазу → менше сечової кислоти.</li>
<li>Синдром Леша–Найхана (дефіцит ГГФРТ, шлях порятунку не працює) — рідкісний; важка гіперурикемія, самоушкодження.</li></ul></div>

<h2>1. Мембрана — «паркан із воротами»</h2>
<p>Кожна клітина оточена <b>мембраною</b> — подвійним шаром жирів (ліпідів). Жир не пропускає воду і заряджені частинки (іони Na⁺, K⁺, Ca²⁺, Cl⁻). Тому в паркані є «ворота» — білки:</p>
<table><tr><th>Спосіб</th><th>Аналогія</th><th>Енергія</th><th>Приклад</th></tr>
<tr><td><b>Проста дифузія</b></td><td>просочується крізь паркан</td><td>не потрібна</td><td>O₂, CO₂</td></tr>
<tr><td><b>Канали</b></td><td>відчинені/зачинені ворота</td><td>не потрібна</td><td>Na⁺-, K⁺-канали</td></tr>
<tr><td><b>Переносники</b></td><td>турнікет, що пропускає по одному</td><td>не потрібна</td><td>GLUT (глюкоза)</td></tr>
<tr><td><b>Активний транспорт</b></td><td>насос, що качає «проти течії»</td><td><b>АТФ</b></td><td><b>Na⁺/K⁺-АТФаза</b></td></tr></table>
<p>Речовини самі течуть <b>з місця, де їх багато, туди, де мало</b> (як вода з гори). Качати навпаки можна лише насосом, витрачаючи енергію.</p>
<h2>2. Натрій-калієвий насос — найважливіший насос тіла</h2>
<p><b>Na⁺/K⁺-АТФаза</b> на кожну молекулу АТФ <b>викачує 3 Na⁺ назовні і закачує 2 K⁺ всередину</b>. Вона з'їдає до третини всієї енергії тіла (у нейронах — ще більше).</p>
<div class="box mn">Запам'ятай розподіл: <b>Натрій — На вулиці</b> (поза клітиною), <b>Калій — в Клітині</b>.</div>
<h2>3. Потенціал спокою — клітина як батарейка</h2>
<p>Всередині клітини заряд <b>негативний</b> відносно зовнішнього середовища: приблизно <b>−70 мВ</b> у нейроні, <b>−90 мВ</b> у м'язі серця. Це <b>потенціал спокою</b>.</p>
<p><b>Чому так?</b> У спокої мембрана пропускає переважно <b>K⁺</b> (через «канали витоку»). K⁺, якого всередині багато, потроху витікає назовні й виносить позитивний заряд → всередині стає «мінус».</p>
<div class="box">Потенціал спокою визначається насамперед <b>калієм</b>. Тому зміни калію в крові так небезпечні для серця.</div>
<h2>4. Потенціал дії — «електричний імпульс»</h2>
<p>Нерви й м'язи вміють генерувати короткий електричний «спалах» — <b>потенціал дії (ПД)</b>.</p>
<div class="flow">
<div class="floor"><b>1. Поріг.</b> Подразник зсуває заряд до ~ −55 мВ (поріг).</div><div class="arrow">↓</div>

<div class="floor"><b>3. Реполяризація.</b> Na⁺-канали зачиняються, відчиняються <b>K⁺-канали</b> → K⁺ виходить → заряд повертається в мінус.</div><div class="arrow">↓</div>
<div class="floor"><b>4. Слідова гіперполяризація і рефрактерність.</b> На короткий час клітина «перезаряджається» і не відповідає на новий подразник (<b>рефрактерний період</b>). Насос відновлює розподіл іонів.</div></div>
<ul><li><b>«Все або нічого»</b>: не досягли порогу — ПД немає; досягли — ПД завжди однакової сили. Як спуск курка рушниці.</li>

<h2>5. Як імпульс біжить нервом</h2>
<p>ПД в одній ділянці деполяризує сусідню — і хвиля біжить волокном. <b>Мієлін</b> (жирова «ізоляція») змушує імпульс <b>стрибати</b> від перехвату до перехвату (Ранв'є) — у десятки разів швидше (сальтаторне проведення).</p>

{ n:2, title:'Вода, електроліти та кислотно-лужний баланс', time:'~35 хв', html:`
<h2>1. Скільки в нас води і де вона</h2>
<p>Вода — ~<b>60 % маси тіла</b> дорослого чоловіка (у жінок і літніх — менше, у немовлят — ~75 %). Розподіл — «правило третин»:</p>
<div class="flow">
<div class="floor"><b>2/3 — всередині клітин</b> (внутрішньоклітинна рідина)</div>
<div class="floor"><b>1/3 — поза клітинами</b> (позаклітинна), з неї: ¾ — <b>міжклітинна</b> (омиває клітини), ¼ — <b>плазма крові</b></div></div>
<p>Для людини 70 кг: ~42 л води, з них лише ~3 л — плазма.</p>
<h2>2. Головні електроліти</h2>
<table><tr><th>Іон</th><th>Де переважно</th><th>Норма в плазмі</th><th>Головна роль</th></tr>
<tr><td><b>Na⁺</b></td><td>поза клітинами</td><td>135–145 ммоль/л</td><td>утримує воду в позаклітинному просторі, об'єм крові, тиск</td></tr>
<tr><td><b>K⁺</b></td><td>всередині клітин</td><td>3,5–5,0 ммоль/л</td><td>потенціал спокою, серце, м'язи</td></tr>
<tr><td><b>Ca²⁺</b></td><td>кістки, позаклітинно</td><td>2,2–2,6 ммоль/л (загальний)</td><td>скорочення м'язів, згортання крові, нерви</td></tr>
<tr><td><b>Cl⁻, HCO₃⁻</b></td><td>поза клітинами</td><td>Cl⁻ 98–107; HCO₃⁻ 22–26</td><td>баланс зарядів, кислотність</td></tr></table>
<h2>3. «Вода йде за сіллю» — осмос</h2>
<p><b>Осмолярність</b> — скільки «частинок» розчинено в рідині. Вода через мембрани завжди тече туди, де <b>частинок більше</b> (щоб розбавити). Нормальна осмолярність плазми ≈ <b>285–295 мОсм/кг</b>, головний її «творець» — <b>натрій</b>.</p>
<ul><li>Плазма «солоніша» (гіпертонічна) → вода виходить з клітин → клітини зморщуються.</li>
<li>Плазма «розбавлена» (гіпотонічна) → вода заходить у клітини → клітини (і мозок!) набрякають.</li></ul>
<h2>4. Хто регулює воду і сіль</h2>
<table><tr><th>Регулятор</th><th>Коли виділяється</th><th>Що робить</th></tr>
<tr><td><b>Спрага</b></td><td>↑ осмолярність, ↓ об'єм</td><td>п'ємо</td></tr>
<tr><td><b>АДГ (вазопресин)</b> — з гіпофіза</td><td>↑ осмолярність, ↓ об'єм крові</td><td>нирки <b>затримують воду</b> → концентрована сеча</td></tr>
<tr><td><b>Альдостерон</b> — з наднирників</td><td>↓ тиск/об'єм (через ренін), ↑ K⁺</td><td>нирки <b>затримують Na⁺</b> (а за ним воду) і <b>виводять K⁺</b></td></tr>
<tr><td><b>Натрійуретичний пептид (НУП)</b> — з серця</td><td>серце розтягнуте надлишком об'єму</td><td>нирки <b>виводять Na⁺</b> і воду</td></tr></table>
<div class="box mn"><b>АДГ — про воду</b>, <b>альдостерон — про сіль (і калій)</b>.</div>
<h2>5. Сили Старлінга — як рідина виходить з капілярів</h2>
<p>У капілярі діють дві сили:</p>
<ul><li><b>Гідростатичний тиск</b> (тиск крові) — <b>виштовхує</b> рідину з судини в тканини. Як вода з дірявого шланга.</li>
<li><b>Онкотичний тиск</b> (створюють білки плазми, головно <b>альбумін</b>) — <b>втягує</b> рідину назад. Як губка.</li></ul>
<p>На початку капіляра переважає виштовхування, в кінці — втягування; надлишок забирає <b>лімфа</b>. Порушення цього балансу = <b>набряки</b> (патофізіологія, тема 2).</p>
<h2>6. Кислотно-лужний баланс (pH)</h2>
<p>pH крові — <b>7,35–7,45</b> (слабколужний). Навіть невеликі відхилення порушують роботу ферментів. Організм щодня виробляє багато кислот (CO₂ з дихання, лактат, кетони). Як він тримає pH?</p>
<table><tr><th>Захист</th><th>Швидкість</th><th>Як працює</th></tr>
<tr><td><b>Буфери</b> (бікарбонат, гемоглобін, білки, фосфати)</td><td>секунди</td><td>«губки» для H⁺</td></tr>
<tr><td><b>Легені</b></td><td>хвилини</td><td>видихають CO₂ (кислоту). Частіше дихання → менше кислоти</td></tr>
<tr><td><b>Нирки</b></td><td>години–дні</td><td>виводять H⁺, зберігають/утворюють бікарбонат (HCO₃⁻)</td></tr></table>
<div class="box mn">Головна формула для розуміння: <b>pH залежить від співвідношення HCO₃⁻ (луг, керують нирки) / CO₂ (кислота, керують легені)</b>. Більше CO₂ → кисліше; більше HCO₃⁻ → лужніше.</div>
<p>Норми газів артеріальної крові: <b>pCO₂ 35–45 мм рт. ст.</b>, <b>HCO₃⁻ 22–26 ммоль/л</b>.</p>

{ n:3, title:'Кров: клітини крові та згортання', time:'~35 хв', html:`
<h2>1. Із чого складається кров</h2>
<p>Кров — ~<b>5 л</b> у дорослого (≈7 % маси тіла).</p>
<ul><li><b>Плазма (~55 %)</b>: вода + білки (альбумін, глобуліни, фактори згортання) + глюкоза, електроліти, гормони.</li>
<li><b>Формені елементи (~45 %)</b>: еритроцити, лейкоцити, тромбоцити. Частка еритроцитів = <b>гематокрит</b>.</li></ul>
<p>Функції: транспорт (O₂, CO₂, поживні речовини, гормони), захист (імунітет, згортання), регуляція (тепло, pH).</p>
<h2>2. Еритроцити — «вантажівки для кисню»</h2>
<ul><li>Двоввігнуті диски без ядра і мітохондрій (тема біохімії 3!), заповнені <b>гемоглобіном (Hb)</b>, що несе O₂.</li>
<li>Живуть <b>~120 днів</b>, старі руйнує <b>селезінка</b> (з гемоглобіну — білірубін).</li>
<li>Норма Hb: <b>чоловіки 130–170 г/л</b>, <b>жінки 120–150 г/л</b>.</li>
<li>Утворення стимулює <b>еритропоетин (ЕПО)</b> з <b>нирок</b> — у відповідь на гіпоксію.</li>
<li>Для виробництва потрібні: <b>залізо</b> (для гему), <b>B12</b> і <b>фолієва кислота</b> (для поділу клітин).</li>
<li><b>Ретикулоцити</b> — молоді еритроцити; їх кількість показує, чи активно кістковий мозок робить нові клітини.</li></ul>
<h2>3. Лейкоцити — «армія»</h2>
<p>Норма: <b>4–9 × 10⁹/л</b>. Види (лейкоцитарна формула):</p>
<table><tr><th>Клітина</th><th>Частка</th><th>Проти кого</th></tr>
<tr><td><b>Нейтрофіли</b></td><td>~50–70 %</td><td><b>бактерії</b> — «піхота», перші на місці, поїдають (фагоцитоз); з них гній</td></tr>
<tr><td><b>Лімфоцити</b></td><td>~20–40 %</td><td><b>віруси</b>, імунна пам'ять (T- і B-клітини)</td></tr>
<tr><td><b>Моноцити</b></td><td>~3–10 %</td><td>у тканинах стають <b>макрофагами</b> — «прибиральники»</td></tr>
<tr><td><b>Еозинофіли</b></td><td>~1–5 %</td><td><b>паразити</b>, алергія</td></tr>
<tr><td><b>Базофіли</b></td><td>&lt;1 %</td><td>алергія (гістамін)</td></tr></table>
<p><b>Зсув вліво</b> — у крові більше молодих (паличкоядерних) нейтрофілів: кістковий мозок терміново кидає резерви — типово для бактеріальної інфекції.</p>
<h2>4. Тромбоцити — «латки»</h2>
<p>Норма <b>150–400 × 10⁹/л</b>. Це шматочки великих клітин кісткового мозку (мегакаріоцитів), живуть ~7–10 днів. Перші «латають» пошкоджену судину.</p>
<h2>5. Гемостаз — як зупиняється кровотеча</h2>
<div class="flow">
<div class="floor"><b>1. Спазм судини</b> — судина звужується (секунди).</div><div class="arrow">↓</div>
<div class="floor"><b>2. Тромбоцитарна пробка</b> (первинний гемостаз): тромбоцити прилипають до пошкодженої стінки (за допомогою <b>фактора фон Віллебранда</b>), активуються і склеюються між собою — «латка» з тромбоцитів. Тут працюють <b>аспірин і клопідогрель</b> (гальмують склеювання).</div><div class="arrow">↓</div>
<div class="floor"><b>3. Каскад згортання</b> (вторинний гемостаз): фактори плазми вмикають одне одного, як доміно → <b>тромбін</b> → перетворює розчинний <b>фібриноген</b> на нитки <b>фібрину</b> — «арматура», що зміцнює пробку.</div><div class="arrow">↓</div>
<div class="floor"><b>4. Фібриноліз</b>: коли рана загоїлась, <b>плазмін</b> розчиняє фібрин. Продукти розпаду — <b>D-димер</b>.</div></div>
<ul><li>Фактори <b>II, VII, IX, X</b> синтезуються в печінці за участю <b>вітаміну K</b> (мнемоніка: «<b>1972</b>» — 10, 9, 7, 2). Їх блокує <b>варфарин</b>.</li>
<li>Природні «гальма» згортання: <b>антитромбін</b> (його посилює <b>гепарин</b>), протеїни C і S.</li></ul>
<table><tr><th>Аналіз</th><th>Що перевіряє</th><th>Контроль ліків</th></tr>
<tr><td><b>ПЧ / МНВ (INR)</b></td><td>зовнішній шлях (фактор VII)</td><td><b>варфарин</b> (цільове МНВ зазвичай 2–3)</td></tr>

<h2>6. Групи крові</h2>
<p><b>Система AB0</b>: на еритроцитах антигени A, B, обидва (AB) або жодного (0). У плазмі — антитіла проти відсутніх антигенів. <b>Резус (Rh)</b>: є антиген D (Rh+) чи немає (Rh−). Rh− мати + Rh+ плід → ризик гемолітичної хвороби новонародженого → профілактика анти-D імуноглобуліном.</p>

{ n:5, title:'Серце: провідна система, основи ЕКГ, серцевий цикл', time:'~40 хв', html:`
<h2>1. Серце — два насоси в одному</h2>
<div class="flow">
<div class="floor"><b>Праве серце</b> (передсердя + шлуночок) качає «використану» венозну кров у <b>легені</b> — <b>мале коло</b>.</div>
<div class="floor"><b>Ліве серце</b> качає збагачену киснем кров у <b>усе тіло</b> — <b>велике коло</b>. Стінка лівого шлуночка товща — він працює проти вищого тиску.</div></div>
<p><b>Клапани</b> — «односторонні двері»: між передсердями і шлуночками — <b>тристулковий</b> (праворуч) і <b>мітральний</b> (ліворуч); на виході — <b>легеневий</b> і <b>аортальний</b>.</p>
<h2>2. Провідна система — «електропроводка»</h2>
<p>Серце скорочується саме, без команди мозку — це <b>автоматизм</b>. Імпульс іде так:</p>
<div class="flow">
<div class="floor"><b>Синусовий (синоатріальний) вузол</b> у правому передсерді — <b>головний водій ритму</b>, 60–80 (до 100) імпульсів/хв.</div><div class="arrow">↓ по передсердях → передсердя скорочуються</div>
<div class="floor"><b>Атріовентрикулярний (АВ) вузол</b> — «пункт пропуску»: <b>затримує</b> імпульс ~0,1 с, щоб передсердя встигли докачати кров у шлуночки. Сам може бути водієм ритму (40–60/хв).</div><div class="arrow">↓</div>
<div class="floor"><b>Пучок Гіса → ліва і права ніжки → волокна Пуркін'є</b> — швидка «магістраль» по шлуночках → шлуночки скорочуються майже одночасно. Власний ритм шлуночків — лише 20–40/хв.</div></div>
<div class="box">Чим нижче по провідній системі — тим повільніший власний ритм. Тому в нормі командує синусовий вузол (він «найшвидший»).</div>
<h2>3. Основи ЕКГ</h2>
<table><tr><th>Елемент</th><th>Що відбувається</th><th>Норма</th></tr>
<tr><td><b>Зубець P</b></td><td>збудження (деполяризація) <b>передсердь</b></td><td>перед кожним QRS = синусовий ритм</td></tr>
<tr><td><b>Інтервал PR (PQ)</b></td><td>шлях від передсердь до шлуночків (затримка в АВ-вузлі)</td><td><b>0,12–0,20 с</b></td></tr>
<tr><td><b>Комплекс QRS</b></td><td>збудження <b>шлуночків</b></td><td><b>&lt; 0,12 с</b> (вузький)</td></tr>
<tr><td><b>Сегмент ST</b></td><td>шлуночки повністю збуджені</td><td>на ізолінії (підйом — ознака інфаркту!)</td></tr>
<tr><td><b>Зубець T</b></td><td>відновлення (реполяризація) шлуночків</td><td>—</td></tr>
<tr><td><b>Інтервал QT</b></td><td>уся «електрична систола» шлуночків</td><td>QTc ≲ 440–460 мс</td></tr></table>
<p><b>ЧСС за ЕКГ</b> (швидкість 25 мм/с): 300 ÷ кількість великих клітинок між R-R. Наприклад, 4 клітинки → 75/хв.</p>
<h2>4. Серцевий цикл</h2>
<ol><li><b>Діастола</b> (розслаблення, ~2/3 часу в спокої): шлуночки наповнюються кров'ю; наприкінці — «доштовхування» передсердями.</li>
<li><b>Систола</b> шлуночків: тиск росте → <b>закриваються АВ-клапани</b> (<b>I тон</b>, «лаб») → відкриваються аортальний/легеневий → викид крові.</li>
<li>Кінець систоли: тиск падає → <b>закриваються аортальний і легеневий клапани</b> (<b>II тон</b>, «даб»).</li></ol>
<div class="box">Коронарні артерії наповнюються переважно в <b>діастолі</b> (у систолі м'яз їх стискає). Тахікардія вкорочує діастолу → серцю менше крові — тому тахікардія провокує стенокардію.</div>
<h2>5. Скільки серце качає</h2>
<div class="box mn"><b>Хвилинний об'єм (ХОС) = ЧСС × ударний об'єм</b> ≈ 70 × 70 мл ≈ <b>5 л/хв</b> у спокої (при навантаженні — до 20–25 л/хв).</div>

<li><b>Фракція викиду (ФВ)</b> — яку частку крові шлуночок викидає за удар. Норма ≥ 50–55 %.</li>
<li><b>Симпатична</b> система (адреналін, норадреналін, β1-рецептори) ↑ ЧСС і силу скорочень; <b>парасимпатична</b> (блукаючий нерв) ↓ ЧСС.</li></ul>
<h2>6. Особливість ПД серця — «плато»</h2>
<p>У клітинах шлуночків ПД має довге <b>плато</b> за рахунок входу <b>Ca²⁺</b>. Тому рефрактерний період довгий — серце не може «заклинити» в судомному скороченні (тетанусі), а встигає розслабитись і наповнитись. Ca²⁺ також запускає скорочення — тут діють <b>блокатори кальцієвих каналів</b> (верапаміл, дилтіазем).</p>

{ n:6, title:'Судини і артеріальний тиск: як він регулюється', time:'~35 хв', html:`
<h2>1. Типи судин — як система водогону</h2>
<table><tr><th>Судини</th><th>Роль</th><th>Аналогія</th></tr>
<tr><td><b>Аорта, великі артерії</b></td><td>еластичні — «згладжують» поштовхи серця</td><td>магістральні труби з гумовими стінками</td></tr>
<tr><td><b>Артеріоли</b></td><td>створюють головний опір; регулюють тиск і кровотік</td><td><b>крани</b></td></tr>
<tr><td><b>Капіляри</b></td><td>обмін речовин з тканинами</td><td>крапельний полив</td></tr>
<tr><td><b>Вени</b></td><td>містять ~70 % крові, повертають її до серця</td><td>резервуар</td></tr></table>
<p>Внутрішня оболонка судин — <b>ендотелій</b>. Він виробляє <b>оксид азоту (NO)</b> — розширює судини і заважає тромбам (так діють нітрогліцерин і силденафіл). Пошкоджений ендотелій — початок атеросклерозу.</p>
<h2>2. Від чого залежить тиск</h2>
<div class="box mn"><b>АТ = хвилинний об'єм серця × периферичний опір судин</b><br>Як у шлангу: тиск зростає, якщо сильніше відкрити кран (більше води) або затиснути кінець (більший опір).</div>
<ul><li><b>Систолічний</b> (верхній) — пік під час викиду; залежить від сили серця і жорсткості аорти (у літніх — росте).</li>
<li><b>Діастолічний</b> (нижній) — у розслабленні; залежить від тонусу артеріол.</li>
<li><b>Пульсовий тиск</b> = систолічний − діастолічний (~40). <b>Середній АТ</b> ≈ діастолічний + ⅓ пульсового (~93; потрібно ≥ 65 для перфузії органів).</li>
<li>Оптимальний: <b>&lt; 120/80</b>; гіпертензія — від <b>140/90</b> (офісне вимірювання, критерій ESC).</li></ul>

<h3>Швидкий (секунди): барорефлекс</h3>
<p>У <b>каротидному синусі</b> і <b>дузі аорти</b> є <b>барорецептори</b> — «датчики тиску». Тиск ↑ → сигнал у довгастий мозок → симпатика ↓, вагус ↑ → ЧСС ↓, судини розширюються → тиск ↓. І навпаки: встали різко — тиск у голові ↓ → симпатика ↑ → ЧСС ↑, судини звужуються.</p>

{ n:7, title:'Дихання: вентиляція, газообмін, транспорт O₂ і CO₂', time:'~35 хв', html:`
<h2>1. Як ми вдихаємо — «шприц»</h2>
<ul><li><b>Вдих — активний</b>: <b>діафрагма</b> скорочується й опускається, міжреберні м'язи піднімають ребра → об'єм грудної клітки ↑ → тиск у легенях стає нижчим за атмосферний → повітря засмоктується. Як тягнути поршень шприца.</li>
<li><b>Видих у спокої — пасивний</b>: м'язи розслабляються, еластичні легені самі стискаються. При навантаженні чи астмі працюють і м'язи видиху.</li></ul>
<p>Альвеоли вкриті <b>сурфактантом</b> — «миючим засобом», що зменшує поверхневий натяг і не дає їм злипатися. У недоношених його мало → респіраторний дистрес-синдром.</p>
<h2>2. Об'єми легень і спірометрія</h2>
<table><tr><th>Показник</th><th>Що це</th><th>Орієнтир</th></tr>
<tr><td>Дихальний об'єм</td><td>звичайний вдих</td><td>~500 мл</td></tr>
<tr><td><b>ЖЄЛ / ФЖЄЛ</b></td><td>максимальний видих після максимального вдиху</td><td>3–5 л</td></tr>
<tr><td><b>ОФВ1</b></td><td>скільки видихнули за <b>першу секунду</b> форсованого видиху</td><td>≥ 80 % належного</td></tr>
<tr><td><b>ОФВ1/ФЖЄЛ</b></td><td>частка, видихнута за 1 с</td><td><b>&gt; 0,7</b> (менше — обструкція)</td></tr></table>
<p><b>Мертвий простір</b> (~150 мл) — повітря в трахеї й бронхах, що не бере участі в газообміні. Тому часте поверхневе дихання неефективне: кожен вдих спершу «заповнює мертвий простір».</p>
<h2>3. Газообмін в альвеолах</h2>
<p>Гази просто <b>дифундують</b> з місця, де їх тиск вищий, туди, де нижчий:</p>
<table><tr><th></th><th>Альвеола</th><th>Венозна кров, що прийшла</th><th>Куди йде газ</th></tr>
<tr><td>O₂</td><td>~100 мм рт. ст.</td><td>~40</td><td>з альвеоли → у кров</td></tr>
<tr><td>CO₂</td><td>~40</td><td>~46</td><td>з крові → в альвеолу</td></tr></table>
<p>Мембрана між повітрям і кров'ю надзвичайно тонка (~0,5 мкм) і величезна (~70 м², як тенісний корт). Для ефективного обміну потрібна відповідність <b>вентиляції (V) і кровотоку (Q)</b>: альвеола без крові або кров біля альвеоли без повітря — марні.</p>
<h2>4. Транспорт кисню</h2>
<ul><li><b>~98 %</b> O₂ — на <b>гемоглобіні</b>, розчиненого — лише ~2 %.</li>
<li><b>Сатурація (SpO₂)</b> — % гемоглобіну, «навантаженого» киснем. Норма <b>95–100 %</b> (пульсоксиметр).</li>
<li><b>Крива дисоціації</b> S-подібна. <b>Зсув вправо</b> = Hb легше віддає O₂ тканинам. Його спричиняють: ↑ CO₂, ↑ кислотність (↓ pH), ↑ температура, ↑ 2,3-БФГ — тобто саме там, де тканина працює (<b>ефект Бора</b>). Розумно!</li></ul>
<div class="box mn">Зсув <b>вправо</b> = «<b>віддаю</b>» (працюючий м'яз, гарячка, ацидоз). Зсув вліво = «тримаю» (фетальний Hb, CO, холод).</div>
<h2>5. Транспорт CO₂</h2>
<p>~70 % — у вигляді <b>бікарбонату (HCO₃⁻)</b> (фермент карбоангідраза в еритроцитах), ~20 % — зв'язаний з гемоглобіном, ~10 % — розчинений. Тому дихання і кислотно-лужний баланс тісно пов'язані.</p>
<h2>6. Хто керує диханням</h2>
<ul><li><b>Дихальний центр</b> — у довгастому мозку і мості.</li>
<li><b>Центральні хеморецептори</b> (у довгастому мозку) реагують на <b>CO₂ / pH</b> — це <b>головний</b> стимул дихання в нормі. Затримай дихання — нестерпно хочеться вдихнути через CO₂, а не через нестачу O₂.</li>
<li><b>Периферичні хеморецептори</b> (каротидні та аортальні тільця) реагують переважно на <b>низький O₂</b> (pO₂ &lt; 60).</li></ul>
<div class="box clin"><b>Клініка.</b> У частини пацієнтів з тяжкою ХОЗЛ CO₂ хронічно високий, і центральні рецептори до нього «звикли». Надлишкова кількість кисню може посилити гіперкапнію (через погіршення V/Q та інші механізми) → сонливість, кома. Тому їм дають O₂ дозовано з <b>цільовою SpO₂ 88–92 %</b>.</div>

{ n:8, title:'Нирки: фільтрація, утворення сечі, регуляція', time:'~35 хв', html:`
<h2>1. Що роблять нирки — не лише сеча</h2>
<table><tr><th>Функція</th><th>Як</th></tr>
<tr><td>Виведення відходів</td><td>сечовина, креатинін, сечова кислота, ліки</td></tr>
<tr><td>Баланс води й солей</td><td>Na⁺, K⁺, Ca²⁺, фосфат</td></tr>
<tr><td>Кислотно-лужний баланс</td><td>виводять H⁺, утворюють HCO₃⁻</td></tr>
<tr><td>Тиск</td><td><b>ренін</b> (РААС), об'єм крові</td></tr>
<tr><td>Кров</td><td><b>еритропоетин</b></td></tr>
<tr><td>Кістки</td><td>активують <b>вітамін D</b> (остання стадія)</td></tr>
<tr><td>Глюкоза</td><td>глюконеогенез при голоді</td></tr></table>
<div class="box mn">Мнемоніка функцій: «<b>ВОДА-Е-Д</b>» — Відходи, Осмолярність/солі, Дисбаланс кислот, АТ (ренін), Еритропоетин, віт. D.</div>
<h2>2. Нефрон — «фільтр + сортувальник»</h2>
<p>У кожній нирці ~1 млн нефронів. Кожен — як <b>сито + конвеєр сортування</b>:</p>
<div class="flow">
<div class="floor"><b>Клубочок</b> — сито. Тиск крові продавлює плазму без клітин і великих білків. За добу — <b>~180 л</b> первинної сечі! <b>ШКФ</b> (швидкість клубочкової фільтрації) — <b>≈ 90–120 мл/хв</b>.</div><div class="arrow">↓</div>
<div class="floor"><b>Проксимальний каналець</b> — повертає в кров <b>~65 % Na⁺ і води</b>, <b>всю глюкозу</b>, амінокислоти, бікарбонат. Глюкозу повертають переносники <b>SGLT2</b>.</div><div class="arrow">↓</div>
<div class="floor"><b>Петля Генле</b> — створює «солоний» мозковий шар нирки, щоб потім можна було концентрувати сечу. Тут діє <b>фуросемід</b> (найсильніший діуретик).</div><div class="arrow">↓</div>
<div class="floor"><b>Дистальний каналець</b> — тонке налаштування Na⁺, Ca²⁺. Тут діють <b>тіазиди</b>.</div><div class="arrow">↓</div>
<div class="floor"><b>Збиральна трубочка</b> — фінальне рішення: <b>альдостерон</b> (затримати Na⁺, вивести K⁺; тут діє <b>спіронолактон</b>), <b>АДГ</b> (вставити «водні канали» аквапорини → затримати воду).</div></div>
<p>З 180 л первинної сечі виходить лише <b>~1,5 л</b> — понад <b>99 %</b> повертається.</p>
<h2>3. Глюкоза в сечі</h2>
<p>Переносники глюкози мають межу. Коли глюкоза крові вища за <b>~10 ммоль/л</b> (нирковий поріг), вони не встигають — з'являється <b>глюкозурія</b>, а за глюкозою тягнеться вода → <b>поліурія і спрага</b> при діабеті. <b>Інгібітори SGLT2</b> (дапагліфлозин, емпагліфлозин) свідомо блокують зворотне всмоктування глюкози → виводять цукор із сечею; до того ж захищають нирки і серце.</p>
<h2>4. Як оцінити роботу нирок</h2>
<ul><li><b>Креатинін</b> — відхід з м'язів, утворюється з постійною швидкістю і виводиться фільтрацією. Нирки гірше фільтрують → креатинін ↑. Залежить від м'язової маси (у худої бабусі «нормальний» креатинін може означати знижену функцію).</li>
<li><b>рШКФ</b> (розрахункова ШКФ) за формулою <b>CKD-EPI</b> (враховує креатинін, вік, стать) — головний показник. &lt; 60 мл/хв/1,73 м² понад 3 міс — ХХН.</li>
<li><b>Альбумін/креатинін у сечі</b> — ранній маркер пошкодження фільтра (діабет, АГ).</li>
<li><b>Сечовина</b> — залежить і від нирок, і від білка в їжі, і від печінки.</li></ul>
<h2>5. Як нирки підтримують свій кровотік</h2>
<p>Нирки отримують ~20 % хвилинного об'єму серця. Вони вміють підтримувати стабільну ШКФ при коливаннях тиску (<b>ауторегуляція</b>): звужують <b>виносну</b> артеріолу (ангіотензин II) і розширюють <b>приносну</b> (простагландини).</p>

<div class="box">Хімію перетравлення ми вже пройшли в Біохімії (тема 2). Тут — <b>як працюють органи</b> і хто ними керує.</div>
<h2>1. Шлунок — «кислотний міксер»</h2>

{ n:11, title:'Ендокринна система: гіпофіз, щитоподібна, наднирники, підшлункова', time:'~40 хв', html:`
<h2>1. Гормон — «лист поштою»</h2>
<p>Гормон — речовина, яку залоза випускає <b>в кров</b>, і вона діє на далекі органи, що мають до неї <b>рецептор</b> («поштову скриньку»). Регуляція — через <b>зворотний зв'язок</b>, як термостат: гормону багато → «начальство» зменшує команду; мало — збільшує.</p>
<h2>2. Ієрархія: гіпоталамус → гіпофіз → залоза</h2>
<div class="flow">
<div class="floor"><b>Гіпоталамус</b> — «директор»: рилізинг-гормони (ТРГ, КРГ, ГнРГ…)</div><div class="arrow">↓</div>
<div class="floor"><b>Гіпофіз</b> — «менеджер»: тропні гормони (ТТГ, АКТГ, ФСГ/ЛГ…)</div><div class="arrow">↓</div>
<div class="floor"><b>Периферична залоза</b> — «виконавець»: T4/T3, кортизол, статеві гормони. Вони ж гальмують «начальство» (негативний зворотний зв'язок).</div></div>
<table><tr><th>Передня частка гіпофіза</th><th>Мішень / дія</th></tr>
<tr><td><b>ТТГ</b></td><td>щитоподібна залоза</td></tr><tr><td><b>АКТГ</b></td><td>кора наднирників (кортизол)</td></tr>
<tr><td><b>ФСГ, ЛГ</b></td><td>яєчники/яєчка</td></tr><tr><td><b>СТГ</b> (гормон росту)</td><td>ріст, обмін (через ІФР-1 печінки)</td></tr>
<tr><td><b>Пролактин</b></td><td>вироблення молока</td></tr>
<tr><th>Задня частка</th><th></th></tr>
<tr><td><b>АДГ</b></td><td>нирки — затримка води</td></tr><tr><td><b>Окситоцин</b></td><td>скорочення матки, виділення молока</td></tr></table>
<h2>3. Щитоподібна залоза — «педаль газу» обміну</h2>
<ul><li>Виробляє <b>T4</b> (тироксин, основний) і <b>T3</b> (активніший; більшість T3 утворюється з T4 у тканинах). Потрібен <b>йод</b>.</li>
<li>Дія: ↑ основний обмін і теплопродукцію, ↑ ЧСС і чутливість до адреналіну, ріст і розвиток мозку дитини, моторика кишки, обмін холестерину.</li></ul>
<div class="box mn"><b>ТТГ — найкращий скринінговий тест</b>. Логіка «качелі»: залоза працює погано (гіпотиреоз) → T4 ↓ → гіпофіз «кричить» → <b>ТТГ ↑</b>. Залоза працює надто (гіпертиреоз) → T4 ↑ → гіпофіз мовчить → <b>ТТГ ↓</b>.</div>
<h2>4. Наднирники — «дві залози в одній»</h2>
<table><tr><th>Частина</th><th>Гормон</th><th>Головне</th></tr>
<tr><td rowspan="3"><b>Кора</b></td><td><b>Кортизол</b></td><td>«гормон стресу»: ↑ глюкоза (глюконеогенез), розпад білка, ↓ запалення й імунітет, підтримка тиску. Пік вранці (6–8 год), мінімум уночі.</td></tr>
<tr><td><b>Альдостерон</b></td><td>затримка Na⁺, виведення K⁺ (регулюється РААС і калієм, а не АКТГ)</td></tr>
<tr><td>Андрогени</td><td>частина статевих гормонів</td></tr>
<tr><td><b>Мозкова речовина</b></td><td><b>Адреналін</b>, норадреналін</td><td>«бий або біжи»: ↑ ЧСС, АТ, глюкоза, бронхи розширюються</td></tr></table>
<div class="box warn">Прийом <b>глюкокортикоїдів</b> (преднізолон) тижнями → гіпофіз «засинає» (АКТГ ↓), власні наднирники атрофуються. Різко відмінили → <b>надниркова недостатність</b>. Тому стероїди відміняють поступово.</div>
<h2>5. Підшлункова: інсулін і глюкагон</h2>
<table><tr><th></th><th>Інсулін (β-клітини)</th><th>Глюкагон (α-клітини)</th></tr>
<tr><td>Коли</td><td>після їжі (глюкоза ↑)</td><td>голод (глюкоза ↓)</td></tr>
<tr><td>Глюкоза крові</td><td><b>знижує</b> (єдиний такий гормон!)</td><td>підвищує</td></tr>
<tr><td>Дія</td><td>глюкоза в клітини, глікоген, жир, білок</td><td>розпад глікогену, глюконеогенез, кетони</td></tr></table>
<p>Підвищують глюкозу ще <b>кортизол, адреналін, гормон росту</b> («контрінсулярні»). Знижує — лише інсулін.</p>
<p>Глюкоза натще (венозна плазма): <b>норма &lt; 6,1 ммоль/л</b> (ВООЗ; оптимально 3,9–5,5); <b>≥ 7,0 двічі — цукровий діабет</b>. HbA1c ≥ 6,5 % — діабет.</p>
<h2>6. Регуляція кальцію</h2>
<table><tr><th>Гормон</th><th>Кальцій крові</th><th>Як</th></tr>
<tr><td><b>ПТГ</b> (паращитоподібні залози)</td><td>↑</td><td>забирає Ca з кісток, затримує в нирках, активує вітамін D</td></tr>
<tr><td><b>Вітамін D (кальцитріол)</b></td><td>↑</td><td>всмоктування Ca і фосфату в кишці</td></tr>
<tr><td>Кальцитонін</td><td>↓ (слабко)</td><td>гальмує руйнування кістки</td></tr></table>

{ n:12, title:'Нервова система: синапс, рефлекс, вегетативна НС, біль', time:'~40 хв', html:`
<h2>1. Синапс — «передача естафети»</h2>
<p>Між нейронами немає прямого дроту — є <b>щілина (синапс)</b>. Сигнал переходить хімічно:</p>
<div class="flow">
<div class="floor">1. ПД добігає до закінчення нейрона → відчиняються канали Ca²⁺ → Ca²⁺ входить.</div><div class="arrow">↓</div>
<div class="floor">2. Бульбашки з <b>нейромедіатором</b> виливаються в щілину.</div><div class="arrow">↓</div>
<div class="floor">3. Медіатор зв'язується з <b>рецепторами</b> наступної клітини → збудження або гальмування.</div><div class="arrow">↓</div>
<div class="floor">4. Медіатор «прибирають»: <b>зворотне захоплення</b> (серотонін, норадреналін, дофамін) або <b>фермент</b> (ацетилхолін руйнує <b>ацетилхолінестераза</b>).</div></div>
<table><tr><th>Медіатор</th><th>Головне</th><th>Ліки / клініка</th></tr>
<tr><td><b>Глутамат</b></td><td>головний <b>збуджувальний</b></td><td>надлишок — загибель нейронів при інсульті</td></tr>
<tr><td><b>ГАМК</b></td><td>головний <b>гальмівний</b></td><td>бензодіазепіни, алкоголь, барбітурати посилюють ГАМК</td></tr>
<tr><td><b>Ацетилхолін</b></td><td>м'язи, парасимпатика, пам'ять</td><td>міастенія, хвороба Альцгеймера (донепезил)</td></tr>
<tr><td><b>Дофамін</b></td><td>рух, мотивація, винагорода</td><td>Паркінсон (↓), шизофренія (антипсихотики блокують)</td></tr>
<tr><td><b>Серотонін</b></td><td>настрій, сон, апетит, кишка</td><td>СІЗЗС (сертралін, есциталопрам) блокують зворотне захоплення</td></tr>
<tr><td><b>Норадреналін</b></td><td>пильність, симпатика</td><td>депресія, тиск</td></tr></table>
<h2>2. Будова нервової системи</h2>
<ul><li><b>ЦНС</b>: головний і спинний мозок. <b>Периферична</b>: нерви.</li>
<li><b>Соматична</b> — свідомі рухи і чутливість. <b>Вегетативна (автономна)</b> — внутрішні органи, без нашої волі.</li></ul>
<h2>3. Рефлекс — «автомат»</h2>
<p><b>Рефлекторна дуга</b>: рецептор → чутливий (аферентний) нерв → центр (спинний мозок) → руховий (еферентний) нерв → м'яз. Приклад — <b>колінний рефлекс</b>: удар молоточком розтягує м'яз → спинний мозок → м'яз скорочується. Мозок навіть не встигає «подумати». Перевірка рефлексів показує, де ушкоджена дуга.</p>
<h2>4. Вегетативна НС: «газ» і «гальмо»</h2>
<table><tr><th>Орган</th><th>Симпатична («бий або біжи»)</th><th>Парасимпатична («відпочинь і перетравлюй»)</th></tr>
<tr><td>Серце</td><td>ЧСС ↑, сила ↑ (β1)</td><td>ЧСС ↓ (блукаючий нерв)</td></tr>
<tr><td>Бронхи</td><td>розширюються (β2)</td><td>звужуються</td></tr>
<tr><td>Зіниці</td><td>розширюються</td><td>звужуються</td></tr>
<tr><td>Травлення</td><td>гальмується</td><td>посилюється, слина</td></tr>
<tr><td>Судини</td><td>звужуються (α1)</td><td>—</td></tr>
<tr><td>Сечовий міхур</td><td>затримка сечі</td><td>сечовипускання</td></tr>
<tr><td>Глюкоза</td><td>↑</td><td>—</td></tr></table>
<table><tr><th>Ліки</th><th>Рецептор</th><th>Ефект</th></tr>
<tr><td>β-блокатори (бісопролол)</td><td>блок β1</td><td>ЧСС ↓, АТ ↓</td></tr>
<tr><td>Сальбутамол</td><td>стимуляція β2</td><td>розширення бронхів</td></tr>
<tr><td>Атропін</td><td>блок М-холінорецепторів</td><td>ЧСС ↑, сухість у роті, розширення зіниць, затримка сечі</td></tr>
<tr><td>Адреналін</td><td>α і β</td><td>анафілаксія: АТ ↑, бронхи розширюються</td></tr></table>
<h2>5. Біль</h2>
<ul><li><b>Ноцицептори</b> — «датчики пошкодження» в тканинах.</li>
<li>Два типи волокон: <b>Aδ</b> — швидкий, гострий, чітко локалізований біль («ой!»); <b>C</b> — повільний, тупий, пекучий, розлитий.</li>
<li>Шлях: нерв → задні роги спинного мозку → <b>спиноталамічний тракт</b> (перехрещується в спинному мозку) → таламус → кора.</li>
<li><b>«Ворітна теорія»</b>: дотик (потерти забите місце) «зачиняє ворота» для болю в спинному мозку.</li>
<li>Власне знеболення мозку — <b>ендорфіни</b> (власні опіоїди).</li>
<li><b>Відбитий біль</b>: біль від внутрішніх органів відчувається в шкірі тієї ж ділянки спинного мозку. Серце → ліва рука, нижня щелепа; діафрагма → плече; апендикс спершу → навколо пупка.</li></ul>
<h2>6. Рухові шляхи (основи)</h2>
<p><b>Центральний (верхній) мотонейрон</b> — від кори до спинного мозку (пірамідний шлях, перехрещується в довгастому мозку → ліва півкуля керує правою половиною тіла). <b>Периферичний (нижній) мотонейрон</b> — від спинного мозку до м'яза. Різниця їх ураження — у патофізіології (тема 12).</p>

{ n:13, title:'Вища нервова діяльність: сон, пам’ять, емоції, стрес', time:'~35 хв', html:`
<h2>1. Сон — два «будильники»</h2>
<p>Коли ми хочемо спати, вирішують два механізми:</p>
<ul><li><b>Циркадний ритм (біологічний годинник)</b> — у гіпоталамусі (супрахіазматичне ядро). Налаштовується <b>світлом</b>. Темрява → шишкоподібна залоза виділяє <b>мелатонін</b> → «пора спати». Синє світло екранів увечері гальмує мелатонін.</li>
<li><b>Тиск сну</b> — чим довше не спимо, тим більше в мозку накопичується <b>аденозину</b> (продукт розпаду АТФ!). <b>Кофеїн блокує рецептори аденозину</b> — тому бадьорить.</li></ul>
<h2>2. Стадії сну</h2>
<table><tr><th>Стадія</th><th>Що відбувається</th><th>Навіщо</th></tr>

<tr><td><b>N3 — глибокий (повільнохвильовий)</b></td><td>важко розбудити; виділяється <b>гормон росту</b></td><td>відновлення тіла, «очищення» мозку, імунітет</td></tr>
<tr><td><b>REM (швидкий сон)</b></td><td>швидкі рухи очей, <b>сновидіння</b>, м'язи паралізовані (щоб не «грати» сни)</td><td>пам'ять, емоційна обробка</td></tr></table>
<p>Цикл ~<b>90 хв</b>, за ніч 4–6 циклів. На початку ночі більше глибокого сну, під ранок — REM. Дорослим потрібно <b>7–9 год</b>.</p>

<h2>1. Загальний принцип</h2>
<p>Кожна сенсорна система: <b>рецептор</b> (перетворює світло, звук, тиск у ПД — «перекладач») → <b>нерв</b> → <b>таламус</b> («диспетчер», крім нюху) → <b>кора</b> (усвідомлення). Рецептори <b>адаптуються</b>: постійний подразник перестаємо помічати (запах у кімнаті, годинник на руці).</p>
<h2>2. Зір — око як фотоапарат</h2>
<table><tr><th>Частина ока</th><th>Аналог у фотоапараті</th></tr>

<h2>3. Слух</h2>
<div class="flow">
<div class="floor"><b>Зовнішнє вухо</b> — збирає звук. <b>Барабанна перетинка</b> вібрує.</div><div class="arrow">↓</div>

<h2>5. Інші відчуття (коротко)</h2>
<p><b>Нюх</b> — єдиний шлях, що йде в кору без таламуса, тісно пов'язаний з емоціями й пам'яттю; втрата нюху — при COVID-19, ранній ознаці хвороби Паркінсона. <b>Смак</b>: солодкий, солоний, кислий, гіркий, умамі. <b>Соматосенсорна</b> система: дотик, тиск, вібрація, температура, біль, положення тіла (пропріоцепція).</p>

<p><b>Рухова одиниця</b> = один мотонейрон + усі м'язові волокна, які він «обслуговує». Тонка робота (пальці, очі) — малі одиниці; сила (стегно) — великі.</p>
