{ n:2, title:'Набряки, зневоднення, порушення Na/K/Ca, ацидоз і алкалоз', time:'~40 хв', html:`
<div class="box"><b>Пара до Фізіології 2.</b> Згадай: вода йде за сіллю, сили Старлінга, pH = HCO₃⁻ / CO₂.</div>
<h2>1. Набряки — чотири механізми</h2>
<table><tr><th>Механізм</th><th>Аналогія</th><th>Приклади</th></tr>
<tr><td><b>↑ гідростатичний тиск</b></td><td>шланг з високим тиском — сильніше «бризкає»</td><td><b>серцева недостатність</b>, тромбоз вен, варикоз, амлодипін (набряк гомілок)</td></tr>
<tr><td><b>↓ онкотичний тиск</b> (мало альбуміну)</td><td>губка висохла — не втягує</td><td><b>нефротичний синдром</b> (втрата з сечею), <b>цироз</b> (не синтезується), голод</td></tr>
<tr><td><b>↑ проникність судин</b></td><td>шланг дірявий</td><td><b>запалення</b>, <b>алергія</b> (набряк Квінке), опіки, сепсис</td></tr>
<tr><td><b>Порушення відтоку лімфи</b></td><td>засмічений дренаж</td><td>після видалення лімфовузлів (мастектомія), пухлини, філяріоз</td></tr></table>
<div class="box mn">Набряк <b>серцевий</b> — на ногах, увечері, симетричний, «ямка» від пальця. <b>Нирковий</b> (нефротичний) — <b>обличчя, повіки, вранці</b>. Набряк однієї ноги — думай про <b>тромбоз</b>!</div>
<h2>2. Зневоднення</h2>
<p>Причини: блювання, діарея, лихоманка, піт, діуретики, мало пиття (літні люди — притуплена спрага!).</p>
<p>Ознаки: спрага, сухість слизових, ↓ тургор шкіри, тахікардія, <b>ортостатична гіпотензія</b>, мало сечі (темна), у тяжких — сплутаність, шок. Лабораторно: ↑ гематокрит, ↑ сечовина (більше, ніж креатинін).</p>
<h2>3. Натрій — про воду в мозку</h2>
<table><tr><th></th><th>Гіпонатріємія (&lt; 135)</th><th>Гіпернатріємія (&gt; 145)</th></tr>
<tr><td>Суть</td><td><b>забагато води</b> відносно солі</td><td><b>замало води</b></td></tr>
<tr><td>Причини</td><td><b>тіазидні діуретики</b>, СНСАДГ (пневмонія, рак легені, СІЗЗС, біль, нудота), серцева недостатність, цироз, «пиво без закуски», надмірне пиття води</td><td>втрата води без доступу до пиття (лежачі літні, немовлята), нецукровий діабет</td></tr>
<tr><td>Клітини мозку</td><td><b>набрякають</b> → головний біль, сплутаність, падіння, судоми</td><td>зморщуються → сплутаність, кома</td></tr></table>
<div class="box warn">Хронічну гіпонатріємію виправляють <b>повільно</b> (не більше ~8–10 ммоль/л за добу). Занадто швидка корекція → <b>осмотична демієлінізація</b> (тяжке, часто незворотне ураження стовбура мозку).</div>
<h2>4. Калій — про серце</h2>
<table><tr><th></th><th>Гіпокаліємія (&lt; 3,5)</th><th>Гіперкаліємія (&gt; 5,5)</th></tr>
<tr><td>Причини</td><td>діуретики (фуросемід, тіазиди), блювання, діарея, проносні, надлишок альдостерону, інсулін, сальбутамол</td><td><b>ХХН</b>, <b>іАПФ/сартани, спіронолактон</b>, НПЗП, ацидоз, рабдоміоліз, гемоліз (у пробірці — хибна!)</td></tr>
<tr><td>Симптоми</td><td>слабкість, судоми м'язів, закреп, аритмії</td><td>слабкість, <b>аритмії, зупинка серця</b> (часто без попереджувальних симптомів)</td></tr>
<tr><td>ЕКГ</td><td>плаский T, зубець U</td><td><b>високий загострений T</b> → широкий QRS → «синусоїда»</td></tr>
<tr><td>Невідкладно</td><td>калій всередину / в/в</td><td><b>кальцію глюконат</b> (захищає серце) + <b>інсулін з глюкозою</b> (заганяє K⁺ у клітини) + сальбутамол; виведення K⁺</td></tr></table>
<h2>5. Кальцій</h2>
<ul><li><b>Гіперкальціємія</b>: 90 % — <b>гіперпаратиреоз</b> або <b>рак</b> (метастази, мієлома). Мнемоніка «<b>камені, кістки, стогони, психи</b>»: нирковий камінь, біль у кістках, біль у животі/закрепи, депресія/сплутаність; + спрага, поліурія.</li>
<li><b>Гіпокальціємія</b>: після операції на щитоподібній залозі, дефіцит вітаміну D, ХХН → <b>тетанія</b> (фізіологія 16).</li></ul>
<h2>6. Кислотно-лужні порушення — 4 варіанти</h2>
<table><tr><th>Порушення</th><th>pH</th><th>Первинна зміна</th><th>Причини</th><th>Компенсація</th></tr>
<tr><td><b>Метаболічний ацидоз</b></td><td>↓</td><td>HCO₃⁻ ↓</td><td><b>ДКА</b>, лактат-ацидоз (шок), ХХН, діарея, отруєння (метанол)</td><td>легені: часте глибоке дихання (<b>Куссмауля</b>) → CO₂ ↓</td></tr>
<tr><td><b>Метаболічний алкалоз</b></td><td>↑</td><td>HCO₃⁻ ↑</td><td><b>блювання</b> (втрата HCl), діуретики</td><td>дихання сповільнюється → CO₂ ↑</td></tr>
<tr><td><b>Респіраторний ацидоз</b></td><td>↓</td><td>CO₂ ↑</td><td>гіповентиляція: <b>загострення ХОЗЛ</b>, опіоїди, слабкість дихальних м'язів</td><td>нирки затримують HCO₃⁻ (повільно)</td></tr>
<tr><td><b>Респіраторний алкалоз</b></td><td>↑</td><td>CO₂ ↓</td><td>гіпервентиляція: <b>тривога/паніка</b>, ТЕЛА, біль, висота, ранній сепсис</td><td>нирки виводять HCO₃⁻</td></tr></table>
<div class="box mn"><b>Алгоритм читання газів крові:</b> 1) pH — ацидоз чи алкалоз? 2) Хто «винен»: CO₂ (дихання) чи HCO₃⁻ (метаболізм)? — той, що змінився <b>в той самий бік, що й pH</b> (кислотний CO₂ ↑ при ацидозі; лужний HCO₃⁻ ↓ при ацидозі). 3) Чи є компенсація з боку іншої системи?</div>

{ n:3, title:'Анемії, зміни лейкоцитів, тромбози і кровотечі', time:'~40 хв', html:`
<div class="box"><b>Пара до Фізіології 3.</b></div>
<h2>1. Анемія — що це і як проявляється</h2>
<p><b>Анемія</b> — зниження гемоглобіну: <b>&lt; 130 г/л у чоловіків</b>, <b>&lt; 120 г/л у жінок</b> (&lt; 110 у вагітних). Це <b>не діагноз, а симптом</b> — завжди шукаємо причину.</p>
<p>Прояви — від нестачі кисню: слабкість, втома, задишка при навантаженні, серцебиття, блідість, запаморочення; у літніх — стенокардія, серцева недостатність.</p>
<h2>2. Класифікація за розміром еритроцитів (MCV)</h2>
<table><tr><th>Тип</th><th>MCV</th><th>Головні причини</th></tr>
<tr><td><b>Мікроцитарна</b> («маленькі»)</td><td>&lt; 80 фл</td><td><b>залізодефіцит</b> (найчастіше!), таласемія, (анемія хронічних хвороб)</td></tr>
<tr><td><b>Нормоцитарна</b></td><td>80–100</td><td>гостра крововтрата, <b>ХХН</b>, анемія хронічних хвороб, гемоліз</td></tr>
<tr><td><b>Макроцитарна</b> («великі»)</td><td>&gt; 100</td><td><b>дефіцит B12 або фолату</b>, алкоголь, гіпотиреоз, хвороби печінки, метотрексат</td></tr></table>
<h3>Залізодефіцитна</h3>
<p><b>Феритин ↓</b> — найкращий тест (але він підвищується при запаленні!). Причини: <b>крововтрата</b> (менструації; у чоловіків і жінок після менопаузи — <b>шукати рак кишки/шлунка!</b>), мало заліза в їжі, порушене всмоктування (целіакія, ІПП), вагітність. Ознаки: ламкі нігті, випадіння волосся, «потяг» до крейди/льоду, синдром неспокійних ніг.</p>
<h3>B12-дефіцитна</h3>
<p>Причини: атрофічний гастрит (немає фактора Касла — перніціозна анемія), <b>метформін</b>, ІПП, веганство, резекція шлунка або клубової кишки. Особливість: <b>неврологічні симптоми</b> (оніміння ніг, порушення ходи, пам'яті) — можуть бути навіть без анемії!</p>
<h3>Гемолітична</h3>
<p>Еритроцити руйнуються зарано: ↑ <b>непрямий білірубін</b> (жовтяниця), ↑ <b>ЛДГ</b>, ↑ <b>ретикулоцити</b> (кістковий мозок намагається компенсувати), ↓ гаптоглобін. Приклади: дефіцит Г6ФД, аутоімунний гемоліз, спадковий сфероцитоз.</p>
<h3>Анемія хронічних хвороб</h3>
<p>При тривалому запаленні (РА, інфекції, рак) печінка виробляє <b>гепсидин</b>, який «замикає» залізо в депо → залізо є, але недоступне. Феритин <b>нормальний або ↑</b>.</p>
<h2>3. Зміни лейкоцитів</h2>
<table><tr><th>Зміна</th><th>Типові причини</th></tr>
<tr><td><b>Нейтрофільоз</b>, зсув вліво</td><td>бактеріальна інфекція, запалення, <b>глюкокортикоїди</b>, стрес, куріння</td></tr>
<tr><td><b>Лімфоцитоз</b></td><td>вірусні інфекції, кашлюк, хронічний лімфолейкоз (у літніх)</td></tr>
<tr><td><b>Еозинофілія</b></td><td>алергія, астма, гельмінти, ліки</td></tr>
<tr><td><b>Нейтропенія</b> (&lt; 1,5; тяжка &lt; 0,5)</td><td>хіміотерапія, ліки (<b>метамізол</b>, тіамазол, клозапін), вірусні інфекції, B12-дефіцит</td></tr></table>
<div class="box warn">Гарячка у людини з нейтропенією (особливо на хіміотерапії) — <b>невідкладний стан</b> (фебрильна нейтропенія): ризик сепсису, антибіотики негайно. Тіамазол + біль у горлі/гарячка → терміново загальний аналіз крові (агранулоцитоз).</div>
<p>Дуже високі лейкоцити (&gt; 50) або бласти в мазку, поєднання анемії + тромбоцитопенії + інфекцій → думай про <b>лейкоз</b>.</p>
<h2>4. Тромбози — тріада Вірхова</h2>
<div class="flow">

<table><tr><th>Ознака</th><th>Чому</th></tr>
<tr><td><b>Почервоніння</b> (rubor)</td><td>розширення судин</td></tr>

<li><b>Проліферація</b> — ремонт: фібробласти, нові судини, рубець.</li></ol>

<h2>2. Ішемія міокарда — «попит перевищує пропозицію»</h2>
<p>Міокард отримує O₂ з коронарних артерій. Ішемія — коли <b>доставка O₂ &lt; потреби</b>:</p>
<ul><li>↓ доставка: <b>атеросклеротичне звуження</b>, тромб, спазм, анемія, гіпотензія, тахікардія (коротка діастола).</li>
<li>↑ потреба: навантаження, тахікардія, гіпертензія, гіпертрофія, гіпертиреоз.</li></ul>
<table><tr><th></th><th>Стабільна стенокардія</th><th>Гострий коронарний синдром (ГКС)</th></tr>
<tr><td>Що в судині</td><td><b>стабільне звуження</b> бляшкою (≳ 70 %)</td><td><b>розрив бляшки + тромб</b></td></tr>
<tr><td>Біль</td><td>при навантаженні, до 5–10 хв, минає у спокої або від нітрогліцерину</td><td>у спокої, &gt; 15–20 хв, не минає від нітрогліцерину</td></tr>
<tr><td>Тропонін</td><td>норма</td><td>↑ при інфаркті</td></tr></table>
<p>При повній оклюзії: через ~20–30 хв починається <b>некроз</b> (патофізіологія 1) → <b>інфаркт міокарда</b>. На ЕКГ — <b>підйом ST</b> (ІМпST → термінова реперфузія: стентування / тромболізис). Чим швидше відкрита артерія — тим більше врятованого м'яза («час — це міокард»).</p>
<h2>3. Серцева недостатність (СН)</h2>
<p>Серце <b>не може качати стільки крові, скільки потрібно</b> тканинам, або робить це лише ціною високого тиску наповнення.</p>
<table><tr><th>Тип за ФВ</th><th>Суть</th><th>Типові причини</th></tr>
<tr><td><b>СНзнФВ</b> (ФВ ≤ 40 %)</td><td>«<b>слабкий</b>» шлуночок — погано скорочується</td><td>інфаркт, дилатаційна кардіоміопатія, алкоголь</td></tr>

<table><tr><th>Лівошлуночкова → застій у <b>легенях</b></th><th>Правошлуночкова → застій у <b>великому колі</b></th></tr>

<p>Найчастіша причина правої СН — ліва СН.</p>

<div class="flow">

{ n:10, title:'Голодування, ожиріння, порушення терморегуляції', time:'~35 хв', html:`
<div class="box"><b>Пара до Фізіології 10.</b> Біохімічна основа — Біохімія 12 («режими роботи»).</div>
<h2>1. Голодування — три періоди</h2>
<table><tr><th>Період</th><th>Що відбувається</th></tr>
<tr><td><b>1. Перші ~24 год</b></td><td>витрачається <b>глікоген</b> печінки</td></tr>
<tr><td><b>2. Пристосування</b> (дні–тижні)</td><td>глюконеогенез з білків → потім ліполіз і <b>кетоз</b>: мозок переходить на кетони → <b>білок береже</b>; обмін ↓ (T3 ↓) — «режим економії»</td></tr>
<tr><td><b>3. Термінальний</b></td><td>жир закінчився → розпад життєво важливих білків (серце, дихальні м'язи, імунітет) → смерть</td></tr></table>
<h3>Білково-енергетична недостатність</h3>
<ul><li><b>Маразм</b> — нестача всього: «шкіра і кістки», без набряків.</li>
<li><b>Квашіоркор</b> — переважно нестача білка: <b>набряки</b> (↓ альбумін → ↓ онкотичний тиск!), жирова печінка, «великий живіт».</li>
<li><b>Саркопенія</b> — втрата м'язової маси і сили у літніх; ↑ ризик падінь, залежності.</li>
<li><b>Кахексія</b> — виснаження при <b>раку, СН, ХОЗЛ, ХХН</b>: зумовлена <b>запаленням</b> (ФНП-α, ІЛ-6), а не тільки нестачею їжі; просте годування не повністю допомагає.</li></ul>
<div class="box warn"><b>Синдром відновленого харчування</b> (refeeding): після тривалого голоду різке годування вуглеводами → інсулін ↑ → <b>фосфат, калій, магній</b> раптово заходять у клітини → їх рівень у крові падає → аритмії, СН, судоми. Годують поступово, з контролем електролітів і тіаміном.</div>
<h2>2. Ожиріння</h2>
<p><b>ІМТ</b> = маса (кг) / зріст² (м²). 25–29,9 — надлишкова маса; <b>≥ 30 — ожиріння</b>. Важливіше — <b>окружність талії</b> (абдомінальне ожиріння): <b>&gt; 94 см у чоловіків, &gt; 80 см у жінок</b> (європейські критерії; вищий ризик — &gt; 102 / &gt; 88).</p>
<p>Причини: позитивний енергобаланс + генетика, <b>резистентність до лептину</b>, недосипання, стрес (кортизол), ліки (стероїди, антипсихотики, інсулін, деякі антидепресанти), гіпотиреоз (рідко основна причина).</p>
<h3>Чому вісцеральний жир шкідливий</h3>
<p>Жир у животі — не пасивний склад, а <b>активний «орган»</b>: викидає жирні кислоти прямо у ворітну вену (до печінки) і <b>запальні цитокіни</b> → <b>інсулінорезистентність</b> → печінка жиріє, підшлункова перевантажується.</p>
<div class="box mn"><b>Метаболічний синдром</b> = абдомінальне ожиріння + ≥ 2 з: <b>ТГ ↑</b> (≥ 1,7), <b>ЛПВЩ ↓</b> (&lt; 1,0 у ч / &lt; 1,3 у ж), <b>АТ ≥ 130/85</b>, <b>глюкоза натще ≥ 5,6</b>.</div>
<p><b>Ускладнення ожиріння</b>: ЦД 2 типу, АГ, дисліпідемія, ІХС, СН, ФП, НАЖХП, <b>обструктивне апное сну</b>, остеоартроз колін, ГЕРХ, подагра, безпліддя (СПКЯ), депресія, деякі <b>види раку</b> (кишки, молочної залози, ендометрію).</p>
<p>Добра новина: схуднення на <b>5–10 %</b> вже суттєво покращує тиск, глюкозу, ліпіди, печінку.</p>
<h2>3. Перегрівання</h2>
<table><tr><th></th><th>Теплове виснаження</th><th><b>Тепловий удар</b></th></tr>
<tr><td>Температура</td><td>до ~40 °C</td><td><b>&gt; 40 °C</b></td></tr>
<tr><td>Свідомість</td><td><b>збережена</b> (слабкість, нудота, головний біль, рясний піт)</td><td><b>порушена</b> (сплутаність, судоми, кома); піт може зникнути</td></tr>
<tr><td>Допомога</td><td>тінь, рідина, охолодження</td><td><b>невідкладне активне охолодження</b> (холодна вода, лід) — кожна хвилина важить; жарознижувальні не працюють</td></tr></table>
<p>Ліки-гіпертермія (рідкісні, але небезпечні): <b>злоякісна гіпертермія</b> (анестетики, сукцинілхолін), <b>злоякісний нейролептичний синдром</b> (антипсихотики: ригідність, гарячка, ↑ КФК), <b>серотоніновий синдром</b> (комбінації серотонінергічних ліків: тремор, клонус, гарячка, діарея).</p>
<h2>4. Переохолодження (гіпотермія &lt; 35 °C)</h2>
<ul><li>Легка (32–35 °C): тремтіння, сплутаність, незграбність.</li>
<li>Помірна (28–32 °C): <b>тремтіння зникає</b>, сонливість, брадикардія, ризик аритмій.</li>
<li>Тяжка (&lt; 28 °C): кома, фібриляція шлуночків.</li>
<li>Принцип: «<b>не мертвий, поки не теплий і мертвий</b>» — реанімація триває до зігрівання (холод захищає мозок).</li>
<li>Групи ризику: літні, люди в алкогольному сп'янінні, бездомні, військові в окопах (+ мокрий одяг, вітер).</li></ul>
<p><b>Відмороження</b>: тканини замерзають; зігрівати теплою (не гарячою) водою, не розтирати снігом, не допускати повторного замерзання.</p>

<p>Причини: інсулін, <b>препарати сульфонілсечовини</b>, пропущена їжа, алкоголь, навантаження, ХХН. Симптоми двох груп: <b>адренергічні</b> (тремор, пітливість, серцебиття, голод, тривога) і <b>нейроглікопенічні</b> (сплутаність, дивна поведінка, судоми, кома). Літні й ті, хто давно хворіє, можуть не відчувати перших — найнебезпечніше. Допомога — правило «15»: 15 г швидких вуглеводів, перевірка через 15 хв.</p>

<h2>1. Чим шкодить хронічний стрес</h2>
<p>Гострий стрес — корисна мобілізація. Але коли «тривога» не вимикається тижнями й місяцями, організм платить ціну — <b>алостатичне навантаження</b> («знос від постійного пристосування»).</p>
<table><tr><th>Система</th><th>Наслідок постійно високих кортизолу і симпатики</th></tr>
<tr><td>Серце, судини</td><td><b>гіпертензія</b>, тахікардія, аритмії, ↑ ризик ІМ і інсульту</td></tr>
<tr><td>Обмін</td><td><b>гіперглікемія</b>, інсулінорезистентність, <b>абдомінальне ожиріння</b></td></tr>
<tr><td>Імунітет</td><td>пригнічення → часті інфекції, гірше загоєння; водночас хронічне «тліюче» запалення</td></tr>
<tr><td>Мозок</td><td>пошкодження <b>гіпокампу</b> (пам'ять), гіперактивність мигдалини (тривога), <b>депресія</b></td></tr>
<tr><td>ШКТ</td><td><b>СПК</b>, функціональна диспепсія, ГЕРХ</td></tr>
<tr><td>Сон</td><td>безсоння</td></tr>
<tr><td>Поведінка</td><td>куріння, алкоголь, переїдання — ще більше шкоди</td></tr></table>
<h2>2. Тривожні розлади (колишня назва — «неврози»)</h2>
<p>Нейробіологія: <b>мигдалина «надчутлива»</b> (сигналить про небезпеку там, де її немає), а <b>префронтальна кора слабше її гальмує</b>; порушений баланс серотоніну, норадреналіну, ГАМК.</p>
<table><tr><th>Розлад</th><th>Головне</th></tr>
<tr><td><b>Генералізований тривожний розлад</b></td><td>постійне надмірне занепокоєння «про все» ≥ 6 міс, напруга, втома, порушення сну</td></tr>
<tr><td><b>Панічний розлад</b></td><td>раптові напади жаху з <b>тілесними симптомами</b>: серцебиття, біль у грудях, задишка, поколювання (гіпервентиляція!), страх смерті — часто приходять у швидку з «інфарктом»; страх повторення</td></tr>
<tr><td>Фобії</td><td>страх конкретного (висота, соціальні ситуації)</td></tr>
<tr><td><b>ПТСР</b></td><td>після травматичної події (війна, насильство, ДТП): <b>нав'язливі спогади/флешбеки</b>, кошмари, <b>уникання</b>, <b>підвищена настороженість</b> (гіперзбудження, здригання), емоційне «оніміння» ≥ 1 міс</td></tr>
<tr><td>ОКР</td><td>нав'язливі думки + ритуали</td></tr></table>
<div class="box warn">Перед діагнозом тривожного розладу виключаємо «соматичні маски»: <b>гіпертиреоз</b>, аритмії, гіпоглікемію, <b>кофеїн</b>, абстиненцію, астму, анемію, феохромоцитому (рідко).</div>
<h2>3. Депресія</h2>
<p>Не «поганий настрій», а хвороба мозку з біологічними змінами: ↓ моноамінів (серотонін, норадреналін, дофамін), <b>порушення нейропластичності</b>, гіперактивність осі стресу (ГГН), запалення.</p>
<ul><li>Головні симптоми ≥ 2 тижні: <b>знижений настрій</b> і/або <b>втрата інтересу й задоволення</b> (ангедонія).</li>
<li>Плюс: порушення сну і апетиту, втома, відчуття провини/непотрібності, погана концентрація, сповільненість, <b>думки про смерть</b>.</li>
<li>У практиці сімейного лікаря часто «маскується» скаргами на втому, біль, безсоння. Скринінг: <b>PHQ-2 / PHQ-9</b>; тривога — GAD-7.</li>
<li><b>Завжди питати про суїцидальні думки</b> — запитання не підштовхує, а рятує.</li></ul>
<div class="box clin">Чому працюють <b>СІЗЗС</b> (сертралін, есциталопрам) — підвищують серотонін, а з часом (2–6 тижнів) відновлюють нейропластичність. Тому ефект не одразу! <b>КПТ</b> (когнітивно-поведінкова терапія) «тренує» префронтальну кору керувати мигдалиною — ефективна при тривозі, депресії, ПТСР.</div>
<h2>4. Порушення сну</h2>
<table><tr><th>Розлад</th><th>Механізм</th><th>Що важливо</th></tr>
<tr><td><b>Безсоння</b></td><td><b>гіперзбудження</b> (кортизол, симпатика, «мозок не вимикається») + погані звички + страх не заснути</td><td>перша лінія — <b>КПТ-І</b> (гігієна сну, обмеження часу в ліжку); снодійні — короткими курсами (залежність, падіння у літніх)</td></tr>
<tr><td><b>Обструктивне апное сну</b></td><td>уві сні м'язи глотки розслабляються → дихальні шляхи <b>спадаються</b> → зупинки дихання → гіпоксія і мікропробудження</td><td><b>хропіння</b>, зупинки дихання (каже партнер), <b>денна сонливість</b>, ранковий головний біль; ↑ <b>АГ (резистентна!)</b>, ФП, інсульт, ДТП. Фактори: ожиріння, коротка шия, чоловіча стать. Скринінг — <b>STOP-BANG</b>. Лікування — CPAP, схуднення</td></tr>
<tr><td><b>Синдром неспокійних ніг</b></td><td>порушення дофаміну, часто — <b>дефіцит заліза</b> (феритин &lt; 75)</td><td>неприємні відчуття в ногах увечері, минають при русі</td></tr>
<tr><td>Нарколепсія</td><td>втрата нейронів <b>орексину</b></td><td>раптові «напади» сну, катаплексія (падіння при сміху)</td></tr></table>
<p><b>Хронічне недосипання</b>: ↓ імунітет, ↑ апетит (грелін ↑, лептин ↓) → ожиріння, інсулінорезистентність, ↑ АТ, погіршення пам'яті і настрою, ДТП.</p>

{ n:14, title:'Порушення зору і слуху (базово для сімейного лікаря)', time:'~35 хв', html:`
<div class="box"><b>Пара до Фізіології 14.</b></div>
<h2>1. Порушення рефракції — коротко</h2>
<p>Міопія (око задовге), гіперметропія (закоротке), астигматизм, <b>пресбіопія</b> (вік). Корекція — окуляри, лінзи, лазер. Різке погіршення зору — <b>не</b> «просто окуляри», а привід шукати серйозну причину.</p>
<h2>2. Катаракта — «запітніле скло»</h2>
<p><b>Помутніння кришталика</b>: білки кришталика денатурують і злипаються. Причини: <b>вік</b> (найчастіша), <b>діабет</b>, <b>глюкокортикоїди</b>, УФ, куріння, травма. Симптоми: поступове <b>затуманення</b>, «ореоли» навколо ліхтарів, погіршення в сутінках. Лікування — операція (заміна кришталика), дуже ефективна.</p>
<h2>3. Глаукома — «тихий злодій зору»</h2>
<p>Ушкодження <b>зорового нерва</b>, найчастіше пов'язане з <b>підвищеним внутрішньоочним тиском</b> (порушений відтік рідини ока).</p>
<table><tr><th></th><th>Відкритокутова (~90 %)</th><th><b>Гострий напад закритокутової</b></th></tr>
<tr><td>Перебіг</td><td><b>безболісно, роками</b>, звужується поле зору з периферії («тунельний зір»), пацієнт не помічає</td><td><b>невідкладний стан</b>: раптовий <b>сильний біль в оці</b> й голові, <b>червоне око</b>, різке погіршення зору, <b>райдужні кола</b> навколо світла, <b>нудота і блювання</b>, середньо розширена зіниця, що не реагує, «кам'яне» око</td></tr>
<tr><td>Що робити</td><td><b>скринінг</b> (вимірювання тиску й огляд диска нерва) після 40, особливо при сімейному анамнезі</td><td>терміново до офтальмолога (сліпота за години)</td></tr></table>
<div class="box warn"><b>Антихолінергічні</b> препарати (атропін, деякі антидепресанти, антигістамінні 1-го покоління, спазмолітики) і <b>розширення зіниці</b> можуть спровокувати гострий напад закритокутової глаукоми в схильних людей.</div>
<h2>4. Ураження сітківки</h2>
<ul><li><b>Діабетична ретинопатія</b> — провідна причина сліпоти в працездатному віці; безсимптомна на ранніх стадіях → <b>щорічний огляд очного дна</b> у всіх з ЦД.</li>
<li><b>Гіпертензивна ретинопатія</b> — звуження артерій, крововиливи, набряк диска (при тяжкій АГ).</li>
<li><b>Вікова макулодистрофія</b> — ураження центру зору (жовтої плями): спотворення ліній (тест сітки Амслера), пляма в центрі.</li>
<li><b>Відшарування сітківки</b>: раптові «мушки», спалахи світла, «завіса» — невідкладно.</li></ul>
<div class="box clin"><b>«Червоне око» — червоні прапорці</b> (направити до офтальмолога терміново): <b>сильний біль</b>, <b>зниження зору</b>, світлобоязнь, нереагуюча або деформована зіниця, травма/хімічний опік, контактні лінзи. Без них (свербіж, виділення, «пісок», зір норма) — найчастіше кон'юнктивіт.</div>
<h2>5. Зниження слуху</h2>
<table><tr><th>Тип</th><th>Причини</th><th>Камертони</th></tr>
<tr><td><b>Кондуктивна</b></td><td><b>сірчана пробка</b>, отит (рідина в середньому вусі), перфорація перетинки, отосклероз</td><td>Вебер → у <b>хворе</b> вухо; Рінне: кісткове &gt; повітряного</td></tr>
<tr><td><b>Сенсоневральна</b></td><td><b>пресбіакузис</b> (вік — спершу високі частоти, важко розрізняти мову в шумі), <b>шум / акустична травма</b> (вибухи, стрілянина — актуально для військових!), <b>ототоксичні ліки</b> (аміноглікозиди, великі дози фуросеміду, цисплатин), невринома слухового нерва</td><td>Вебер → у <b>здорове</b> вухо; Рінне: норма</td></tr></table>
<div class="box warn"><b>Раптова сенсоневральна втрата слуху</b> (за години–3 доби, зазвичай одне вухо) — <b>невідкладний стан</b>: лікування кортикостероїдами ефективне лише в перші дні. Не списувати на «сірку»!</div>
<p><b>Шум у вухах (тинітус)</b> — частіше супроводжує сенсоневральну втрату. Однобічний пульсуючий шум або однобічна втрата слуху — привід для обстеження (МРТ).</p>
<p>Втрата слуху в літніх — фактор ризику <b>деменції</b> і депресії; слухові апарати допомагають.</p>
<h2>6. Запаморочення (вертиго) — периферичне чи центральне?</h2>
<table><tr><th>Периферичне (внутрішнє вухо)</th><th>Центральне (мозок — <b>інсульт</b> стовбура/мозочка!)</th></tr>
<tr><td><b>ДППГ</b> (секунди, при поворотах), <b>вестибулярний неврит</b> (дні, після ГРВІ), <b>хвороба Меньєра</b> (напади + шум + втрата слуху)</td><td>раптове, з іншими неврологічними симптомами: <b>двоїння, порушення мови, ковтання, оніміння, слабкість, нездатність стояти/ходити</b>, сильний головний біль</td></tr>
<tr><td>сильна нудота, ністагм в одному напрямку, може ходити (хоча хитає)</td><td>ністагм змінює напрям або вертикальний; часто вік, АГ, ФП, діабет</td></tr></table>

{ n:15, title:'Патологія вагітності (базово)', time:'~40 хв', html:`
<div class="box"><b>Пара до Фізіології 15.</b> Пам'ятай нормальні зміни вагітності — щоб відрізнити їх від патології.</div>
<h2>1. Рання вагітність: кровотеча і біль</h2>
<ul><li><b>Позаматкова вагітність</b> (найчастіше — у матковій трубі): ембріон росте там, де не можна → розрив труби → внутрішня кровотеча. Тріада: <b>затримка менструації (позитивний тест) + біль унизу живота + кров'янисті виділення</b>. Фактори ризику: попередні ІПСШ/запалення органів малого таза, позаматкова в анамнезі, ВМС, ДРТ, куріння. При шоці — невідкладна операція. <b>Будь-яка жінка репродуктивного віку з болем у животі — тест на вагітність!</b></li>
<li><b>Самовільний викидень</b> — найчастіше в I триместрі, часто через хромосомні аномалії ембріона (не через «підняла важке»).</li>
<li><b>Гіперемезис</b> (тяжке блювання вагітних): зневоднення, втрата ваги, гіпокаліємія, кетоз; високий ХГЛ (часто при багатоплідній вагітності, міхуровому заметі).</li></ul>
<h2>2. Гестаційний діабет</h2>
<p>Плацента виробляє гормони (плацентарний лактоген, прогестерон, кортизол), що підвищують <b>інсулінорезистентність</b> — щоб плоду діставалось більше глюкози. Якщо підшлункова матері не може компенсувати → <b>гестаційний ЦД</b>.</p>
<ul><li>Скринінг: <b>ОГТТ з 75 г глюкози на 24–28 тижні</b> (раніше — у групах ризику).</li>
<li>Ризики для дитини: <b>макросомія</b> (великий плід → травми в пологах), <b>неонатальна гіпоглікемія</b> (плід звик виробляти багато інсуліну), дихальні розлади.</li>
<li>Для матері: прееклампсія, кесарів розтин, <b>майбутній ЦД 2 типу</b> (до 50 % за 10 років) → контроль глюкози після пологів і далі.</li></ul>
<h2>3. Гіпертензивні розлади</h2>
<table><tr><th>Стан</th><th>Критерії</th></tr>
<tr><td>Хронічна АГ</td><td>до вагітності або до 20 тижнів</td></tr>
<tr><td>Гестаційна АГ</td><td>≥ 140/90 після 20 тижнів, без ураження органів</td></tr>
<tr><td><b>Прееклампсія</b></td><td>АГ після 20 тижнів + <b>протеїнурія</b> і/або ураження органів (нирки, печінка, тромбоцити, мозок, плацента)</td></tr>
<tr><td><b>Еклампсія</b></td><td>прееклампсія + <b>судоми</b></td></tr>
<tr><td><b>HELLP</b></td><td><b>H</b>emolysis + <b>E</b>levated <b>L</b>iver enzymes + <b>L</b>ow <b>P</b>latelets</td></tr></table>
<p><b>Механізм прееклампсії</b>: на ранніх термінах плацента «неправильно вростає» — спіральні артерії матки не розширюються → плацента в ішемії → викидає в кров речовини, що пошкоджують <b>ендотелій усього тіла</b> → спазм судин, АГ, «діряві» клубочки (протеїнурія), набряки, тромбоцити ↓.</p>
<div class="box clin"><b>Тривожні симптоми</b>: сильний <b>головний біль</b>, <b>порушення зору</b> (мушки, спалахи), <b>біль в епігастрії / правому підребер'ї</b>, різкі набряки обличчя і рук, задишка, АТ ≥ 160/110 → терміново в стаціонар. Профілактика в групі високого ризику — <b>аспірин у малій дозі з 12 тижня</b>. При тяжкій прееклампсії — <b>магнію сульфат</b> (профілактика судом); остаточне лікування — розродження.</div>
<h2>4. Інше важливе</h2>
<ul><li><b>Анемія вагітних</b>: до фізіологічного розведення додається <b>дефіцит заліза</b> (плід + плацента + об'єм крові забирають ~1 г заліза). Hb &lt; 110 г/л — анемія.</li>
<li><b>Тромбоемболія</b>: ризик ↑ у 4–5 разів, ще більше — <b>після пологів</b> (особливо кесарів розтин). Однобічний набряк ноги, задишка — не списувати на вагітність. Лікують <b>низькомолекулярними гепаринами</b> (не проходять через плаценту), <b>не варфарином і не НОАК</b>.</li>
<li><b>Резус-конфлікт</b>: Rh− мати + Rh+ плід → материнські IgG проти еритроцитів плода (тип II) → гемоліз у плода. Профілактика — <b>анти-D імуноглобулін</b>.</li>
<li><b>Холестаз вагітних</b>: сильний свербіж (особливо долонь і стоп) у III триместрі, ↑ жовчні кислоти — ризик для плода.</li>
<li>Інфекції сечових шляхів — частіші (прогестерон розслабляє сечоводи); навіть <b>безсимптомну бактеріурію лікують</b> (ризик пієлонефриту, передчасних пологів).</li></ul>
<h2>5. Ліки і вагітність</h2>
<table><tr><th>Заборонені / небезпечні (тератогени)</th><th>Відносно безпечні (за показами)</th></tr>
<tr><td><b>іАПФ, сартани</b> (ураження нирок плода), <b>варфарин</b>, <b>вальпроат</b> (дефекти нервової трубки, затримка розвитку), <b>ізотретиноїн</b>, тетрацикліни, метотрексат, статини, алкоголь, НПЗП у III триместрі (закриття артеріальної протоки)</td><td><b>парацетамол</b>, пеніциліни, цефалоспорини, <b>метилдопа, лабеталол, ніфедипін</b> (тиск), інсулін, левотироксин (дозу часто збільшують!), низькомолекулярні гепарини</td></tr></table>
<div class="box mn"><b>Фолієва кислота 400 мкг/добу</b> — щонайменше за 1–3 місяці <b>до</b> зачаття і в I триместрі: знижує ризик дефектів нервової трубки (spina bifida). Вищі дози — при ризику (вальпроат, ожиріння, попередні дефекти, діабет). Також <b>йод</b>.</div>

{ n:16, title:'Остеопороз і хвороби м’язів', time:'~35 хв', html:`
<div class="box"><b>Пара до Фізіології 16.</b> Згадай: остеобласти будують, остеокласти руйнують; ПТГ і вітамін D.</div>
<h2>1. Остеопороз</h2>
<p>Зниження <b>маси</b> кістки і порушення її <b>мікроархітектури</b> → кістка стає «губчастою», як старий корал → <b>переломи від мінімальної травми</b> (падіння з висоти власного зросту).</p>
<p>Типові переломи: <b>шийка стегна</b> (висока смертність у літніх!), <b>хребці</b> (компресійні — зниження зросту, «горб», біль у спині, часто непомітні), <b>променева кістка</b> в типовому місці (впав на руку).</p>
<h3>Механізм — руйнування переважає будівництво</h3>
<table><tr><th>Причина</th><th>Як</th></tr>
<tr><td><b>Менопауза</b> (головна у жінок)</td><td>естрогени гальмували остеокласти → без них руйнування прискорюється (до 2–3 % кісткової маси на рік у перші роки)</td></tr>
<tr><td>Вік</td><td>остеобласти працюють гірше, менше вітаміну D і Ca</td></tr>
<tr><td><b>Глюкокортикоїди</b> (≥ 3 міс, ≥ 5 мг преднізолону)</td><td>пригнічують остеобласти — найчастіша причина вторинного остеопорозу</td></tr>
<tr><td>Низькі Ca, вітамін D, низька маса тіла</td><td>немає «будматеріалу»</td></tr>
<tr><td>Нерухомість</td><td>кістка без навантаження «не потрібна»</td></tr>
<tr><td>Куріння, алкоголь</td><td>токсичні для остеобластів</td></tr>
<tr><td>Гіпертиреоз (у т.ч. передозування L-T4), гіперпаратиреоз, гіпогонадизм у чоловіків, целіакія, РА, ІПП (тривало)</td><td>різні механізми</td></tr></table>
<h3>Діагностика</h3>
<ul><li><b>Денситометрія (DXA)</b>: <b>T-критерій ≤ −2,5</b> — остеопороз; від −1 до −2,5 — остеопенія.</li>
<li>Низькотравматичний перелом стегна чи хребця = остеопороз <b>незалежно від DXA</b>.</li>
<li><b>FRAX</b> — калькулятор 10-річного ризику переломів.</li></ul>
<p><b>Лікування</b>: Ca (з їжі ~1000–1200 мг) + <b>вітамін D</b>; <b>бісфосфонати</b> (алендронат, золедронова кислота) — <b>гальмують остеокласти</b>; деносумаб (те саме іншим механізмом; не можна різко відміняти); анаболічні засоби при тяжкому. Плюс профілактика <b>падінь</b>: зір, взуття, ліки, що спричиняють запаморочення, силові вправи і вправи на рівновагу.</p>
<div class="box warn"><b>Остеомаляція ≠ остеопороз.</b> Остеомаляція (у дітей — <b>рахіт</b>) — кістка не <b>мінералізується</b> через дефіцит <b>вітаміну D</b> (або фосфату): кістки м'які, болять, деформуються; ↓ Ca/фосфат, ↑ <b>лужна фосфатаза</b>, ↑ ПТГ. При остеопорозі ці аналізи зазвичай нормальні.</div>
<h2>2. Хвороби м'язів</h2>
<table><tr><th>Стан</th><th>Механізм</th><th>Ключові ознаки</th></tr>
<tr><td><b>Саркопенія</b></td><td>вікова втрата м'язових волокон, гормонів, малорухливість, мало білка</td><td>слабкість, повільна ходьба, падіння. Профілактика — силові вправи + достатньо білка</td></tr>
<tr><td><b>Міастенія гравіс</b></td><td>аутоантитіла до <b>рецепторів ацетилхоліну</b> → сигнал з нерва на м'яз слабшає</td><td><b>слабкість, що наростає при навантаженні і до вечора</b>, <b>птоз</b>, <b>двоїння</b>, порушення ковтання/мови; покращення після відпочинку. Лікування — інгібітори ацетилхолінестерази (піридостигмін). Зв'язок з тимомою</td></tr>
<tr><td><b>Рабдоміоліз</b></td><td>масове руйнування м'язових клітин → у кров виходять <b>міоглобін</b>, K⁺, КФК</td><td>біль, слабкість, <b>темна сеча</b> («кола»), <b>КФК ↑↑</b> (у тисячі разів); ускладнення — <b>ГУН</b> (міоглобін забиває канальці), <b>гіперкаліємія</b>. Причини: травма/синдром тривалого здавлення (завали!), надмірне навантаження, спека, алкоголь, судоми, статини (рідко), наркотики</td></tr>
<tr><td><b>Статинова міопатія</b></td><td>порушення енергетики м'язових клітин</td><td>частіше — болі без ↑ КФК; рідко — міозит з ↑ КФК; ризик ↑ при взаємодіях (макроліди, фібрати)</td></tr>
<tr><td><b>Ревматична поліміалгія</b></td><td>запальне захворювання у людей &gt; 50</td><td><b>біль і скутість плечового і тазового поясу</b> вранці, <b>ШОЕ/СРБ ↑↑</b>, сила збережена, <b>швидкий ефект малих доз преднізолону</b>. Пов'язана з <b>гігантоклітинним артеріїтом</b> (головний біль у скронях, біль при жуванні, порушення зору — <b>загроза сліпоти</b>, невідкладно!)</td></tr>
<tr><td>М'язова дистрофія Дюшенна</td><td>генетичний дефект дистрофіну (X-зчеплений, хлопчики)</td><td>прогресуюча слабкість з дитинства, «підйом драбиною» (симптом Говерса)</td></tr>
<tr><td>Судоми м'язів</td><td>↓ K⁺, Mg²⁺, Ca²⁺, зневоднення, діуретики</td><td>перевірити електроліти</td></tr></table>
<div class="box clin"><b>Синдром тривалого здавлення</b> (краш-синдром): людина під завалами — м'язи довго стиснуті; після звільнення в кров різко надходять K⁺ і міоглобін → <b>зупинка серця від гіперкаліємії</b> і <b>ГУН</b>. Тому ще до звільнення — інфузія рідини, контроль калію. Актуально в умовах війни.</div>

<div class="box"><b>Фундамент:</b> Фізіологія 4–5 (автономна НС, провідна система), Патофізіологія 5 (ІХС, аритмії).</div>
<h2>1. β-блокатори — «-олол»</h2>
<table>
<tr><th>Механізм</th><td>Блокують β1 (серце: ↓ ЧСС, ↓ скоротливість, ↓ AV-провідність, ↓ ренін) і/або β2 (бронхи, судини, печінка). <b>Кардіоселективні (β1)</b>: бісопролол, метопролол, небіволол (+NO-вазодилатація), атенолол. <b>Неселективні</b>: пропранолол, тимолол. <b>Карведилол</b> — β + α1.</td></tr>
<tr><th>Показання</th><td>Стенокардія, після ІМ, <b>ХСНзнФВ</b> (лише <b>бісопролол, метопролол сукцинат, карведилол, небіволол</b>), контроль частоти ФП, тахіаритмії, АГ (не 1-ї лінії без супутніх показань), тиреотоксикоз (симптоми), тремор, профілактика мігрені (пропранолол), портальна гіпертензія (пропранолол, карведилол), глаукома (тимолол краплі), тривога «сцени».</td></tr>
<tr><th>Протипоказання</th><td><b>Бронхіальна астма</b> (неселективні — абсолютно; селективні — обережно), AV-блокада ІІ–ІІІ, СССВ, брадикардія &lt; 50, гіпотензія, <b>гостра декомпенсована СН</b>, кардіогенний шок, тяжка периферична ішемія, <b>кокаїн/амфетамін-асоційований ГКС</b>, нелікована феохромоцитома (спершу α-блокада).</td></tr>
<tr><th>Побічні</th><td>Брадикардія, втома, холодні кінцівки, бронхоспазм, ↓ ерекції, яскраві сни/безсоння (ліпофільні), <b>маскують гіпоглікемію</b> (тахікардію, тремор, але не пітливість), погіршують псоріаз.</td></tr>
<tr><th>Практика</th><td><b>Не відміняти різко</b> — синдром відміни (тахікардія, стенокардія, ІМ). При СН — «start low, go slow»: подвоювати дозу кожні 2–4 тиж. ХОЗЛ — <b>не</b> протипоказання для кардіоселективних.</td></tr>
</table>

<h2>2. Нітрати</h2>
<table>
<tr><th>Механізм</th><td>Донатори <b>NO</b> → ↑ цГМФ → розслаблення гладких м'язів, переважно <b>вен</b> → ↓ переднавантаження → ↓ потреба міокарда в O₂; також розширюють коронарні артерії.</td></tr>
<tr><th>Препарати</th><td><b>Нітрогліцерин</b> під язик/спрей — купірування нападу (до 3 разів через 5 хв; не минає → 103); ізосорбіду мононітрат — профілактика.</td></tr>
<tr><th>Протипоказання</th><td><b>Інгібітори ФДЕ-5</b> (силденафіл — 24 год, тадалафіл — 48 год) — смертельна гіпотензія; САТ &lt; 90; ІМ правого шлуночка; тяжкий аортальний стеноз, ГКМП з обструкцією.</td></tr>
<tr><th>Побічні</th><td><b>Головний біль</b>, припливи, ортостатична гіпотензія, рефлекторна тахікардія; <b>толерантність</b> → потрібен «безнітратний проміжок» 10–14 год (не приймати рівномірно цілу добу).</td></tr>
</table>

<h2>3. Івабрадин, ранолазин, триметазидин</h2>
<table>
<tr><th>Івабрадин</th><td>Блокує <b>If-канали</b> синусового вузла → ↓ ЧСС без впливу на тиск і скоротливість. Показання: стенокардія, ХСНзнФВ з <b>синусовим ритмом і ЧСС ≥ 70</b> на макс. β-блокаторі. <b>Не працює при ФП</b>. Побічне: <b>фосфени</b> (спалахи світла), брадикардія. Не з верапамілом/дилтіаземом, сильними інгібіторами CYP3A4.</td></tr>
<tr><th>Ранолазин</th><td>Блокує пізній Na⁺-струм → ↓ Ca²⁺ перевантаження. Стенокардія (2-га лінія). Подовжує QT; CYP3A4.</td></tr>
<tr><th>Триметазидин</th><td>Перемикає метаболізм міокарда з жирних кислот на глюкозу. Може спричиняти паркінсонізм — протипоказаний при хворобі Паркінсона.</td></tr>
</table>

<h2>4. Дигоксин</h2>
<table>
<tr><th>Механізм</th><td>Блокує <b>Na⁺/K⁺-АТФазу</b> → ↑ Na⁺ → ↑ Ca²⁺ у кардіоміоциті (позитивний інотроп) + ваготонія → ↓ AV-провідність.</td></tr>
<tr><th>Показання</th><td>Контроль частоти ФП (додатково, особливо з СН); ХСНзнФВ з симптомами попри терапію (↓ госпіталізацій, не смертність).</td></tr>
<tr><th>Протипоказання</th><td>AV-блокада, <b>WPW</b>, ГКМП з обструкцією, гіпокаліємія.</td></tr>
<tr><th>Токсичність</th><td><b>Вузький терапевтичний діапазон</b>. Нудота, блювання, анорексія, <b>жовто-зелене бачення</b>, сплутаність, будь-які аритмії (ШЕ, двонаправлена ШТ, ПТ з блокадою). Провокують: <b>гіпокаліємія</b> (діуретики!), гіпомагніємія, гіперкальціємія, ниркова недостатність, літній вік, <b>аміодарон, верапаміл, кларитроміцин</b>. Антидот — фрагменти антитіл до дигоксину.</td></tr>
<tr><th>ЕКГ без токсичності</th><td>«Коритоподібна» депресія ST — ефект, не отруєння.</td></tr>
</table>

<h2>5. Антиаритміки (головне для СЛ)</h2>
<table>
<tr><th>Аміодарон (клас III)</th><td>Блокує K⁺ (і Na⁺, Ca²⁺, β). ФП, ШТ. Дуже довгий T½ (тижні–місяці). <b>Токсичність — «органи, що з йодом і світлом»</b>: щитоподібна (гіпо- і гіпертиреоз, 37 % йоду), <b>легені</b> (фіброз — кашель, задишка), <b>печінка</b>, шкіра (фотосенсибілізація, синьо-сіра пігментація), очі (відкладення в рогівці, неврит), нерви. <b>Контроль: ТТГ і печінкові проби кожні 6 міс, рентген ОГК/спірометрія на старті</b>. Подовжує QT. Інгібітор CYP: ↑ варфарин (зменшити дозу на 30–50 %), дигоксин (вдвічі), статини.</td></tr>
<tr><th>Флекаїнід, пропафенон (IC)</th><td>Блокують Na⁺. ФП без структурної хвороби серця («таблетка в кишені»). <b>Протипоказані при ІХС, ІМ, СН, ГЛШ</b> — проаритмічні (CAST). Давати разом з блокатором AV-вузла (ризик тріпотіння 1:1).</td></tr>
<tr><th>Соталол</th><td>β-блокатор + клас III. QT↑ → torsades; контроль QT і функції нирок.</td></tr>
</table>
<div class="box mn"><b>Препарати, що подовжують QT</b> (сумуються!): аміодарон, соталол, макроліди, фторхінолони, ондансетрон, домперидон, галоперидол, кветіапін, циталопрам/есциталопрам, метадон, гідроксихлорохін, азольні протигрибкові. Гіпо-K, гіпо-Mg, брадикардія, жіноча стать ↑ ризик. QTc &gt; 500 мс — небезпечно.</div>

<h2>1. Антитромбоцитарні</h2>
<table><tr><th></th><th>Аспірин</th><th>Інгібітори P2Y12: клопідогрель, тикагрелор, прасугрель</th></tr>
<tr><td>Механізм</td><td><b>Незворотно</b> блокує ЦОГ-1 тромбоцита → ↓ тромбоксан A2 на весь вік тромбоцита (7–10 днів)</td><td>Блокують рецептор АДФ P2Y12. Клопідогрель — <b>проліки</b> (активує CYP2C19); тикагрелор — зворотний, 2 р/день</td></tr>
<tr><td>Показання</td><td><b>Вторинна профілактика</b> ІХС, ішемічного інсульту, ЗАНК (75–100 мг); ГКС — 150–300 мг розжувати</td><td>ГКС і після стентування — подвійна терапія з аспірином (зазвичай 6–12 міс); клопідогрель — при непереносимості аспірину, після інсульту/ЗАНК</td></tr>

<h2>2. Антикоагулянти</h2>
<table><tr><th></th><th>Варфарин</th><th>НОАК: апіксабан, ривароксабан, едоксабан (анти-Xa); дабігатран (анти-IIa)</th><th>Гепарини: НФГ, НМГ (еноксапарин)</th></tr>

<tr><td>Протипоказання</td><td><b>Вагітність</b> (тератоген, особливо 6–12 тиж), активна кровотеча</td><td><b>механічні клапани, мітральний стеноз</b>, вагітність/лактація, тяжка ХХН (КК &lt; 15; дабігатран &lt; 30), АФС</td><td>ГІТ в анамнезі, активна кровотеча</td></tr>

<div class="box"><b>Фундамент:</b> Біохімія (ейкозаноїди з арахідонової кислоти), Патофізіологія 1 (запалення). Арахідонова кислота → <b>ЦОГ-1</b> (конститутивна: шлунок, нирки, тромбоцити) і <b>ЦОГ-2</b> (індуцибельна: запалення; також у нирках, ендотелії) → простагландини, тромбоксан, простациклін.</div>
<h2>1. Парацетамол</h2>
<table>
<tr><th>Механізм</th><td>Слабко гальмує ЦОГ переважно в <b>ЦНС</b> (там, де мало пероксидів), впливає на серотонінергічні шляхи й ендоканабіноїди. <b>Знеболює і знижує температуру</b>, але <b>майже не протизапальний</b>, не діє на тромбоцити і шлунок.</td></tr>
<tr><th>Показання</th><td>Біль легкий/помірний, гарячка, біль при вагітності (препарат вибору); база «знеболювальної драбини».</td></tr>

</table>

<h2>2. НПЗП</h2>

<tr><td>Механізм</td><td colspan="2">Оборотно блокують ЦОГ → ↓ простагландини: <b>знеболення, жарознижувальна і протизапальна дія</b></td></tr>
<tr><td>Показання</td><td colspan="2">Біль м'язово-скелетний, <b>гострий напад подагри</b>, дисменорея, ниркова колька, головний біль, РА/спондилоартрит (симптоматично), гарячка</td></tr>

<h3>Чим шкодять НПЗП (думати про «4 органи»)</h3>
<ul><li><b>ШКТ</b>: диспепсія, виразки, кровотечі (↓ захисних PG). Ризик ↑: вік &gt; 65, виразка в анамнезі, + аспірин/антикоагулянт/ГК/СІЗЗС, високі дози, H. pylori → <b>ІПП</b> або коксиб + ІПП.</li>
<li><b>Нирки</b>: звуження приносної артеріоли → <b>ГУН</b> (особливо при зневодненні, ХХН, з іАПФ/сартанами + діуретиком), затримка Na⁺ і води, гіперкаліємія, інтерстиційний нефрит, папілярний некроз.</li>

<li>Інше: тромбоцити (кровотеча), гепатотоксичність (німесулід, диклофенак), ↑ <b>літій і метотрексат</b>, асептичний менінгіт.</li></ul>
<div class="box warn"><b>Протипоказання</b>: активна виразка/кровотеча, тяжка СН, рШКФ &lt; 30, ІІІ триместр вагітності (<b>закриття артеріальної протоки</b>, маловоддя — уникати з 20 тиж), N-ERD, після АКШ (коксиби/диклофенак — і при ІХС). Обережно: ІХС, АГ, ХХН 3, літні, антикоагулянти.</div>

<h2>3. Метамізол</h2>
<p><b>Механізм</b>: гальмує ЦОГ у ЦНС + спазмолітична дія. Сильне знеболення і жарознижувальна дія (ниркова/жовчна колька, післяопераційний біль). <b>Агранулоцитоз</b> (рідко, але може бути смертельним; заборонений у ряді країн) — біль у горлі, гарячка, виразки рота → ЗАК; гіпотензія при в/в введенні. Не при вагітності (І і ІІІ триместр), лактації, Г6ФД, порфірії. Для тривалого прийому — не рекомендований.</p>

<div class="box"><b>Фундамент:</b> Фізіологія 5, Патофізіологія 5–6.</div>
<h2>1. Простими словами</h2>
<p>Коронарні артерії звужені бляшкою. У спокої крові вистачає, але при навантаженні серцю треба більше — і воно «просить про допомогу» болем. Відпочив — біль минув. Це <b>стабільна стенокардія</b> (сучасна назва — хронічний коронарний синдром).</p>
<h2>2. Як розпізнати типову стенокардію</h2>
<p>Три ознаки:</p>
<ol><li><b>Дискомфорт за грудниною</b> — тиснучий, стискаючий, пекучий («цеглина на грудях»), може віддавати в ліву руку, шию, щелепу, спину, епігастрій.</li>
<li><b>Провокується навантаженням</b> або емоціями, холодом, після їжі.</li>
<li><b>Минає за кілька хвилин у спокої або від нітрогліцерину.</b></li></ol>
<p>3 з 3 — типова, 2 — атипова, 0–1 — некардіальний біль. Еквівалент стенокардії — <b>задишка</b> при навантаженні (особливо у літніх, жінок, діабетиків).</p>
<div class="box"><b>Скоріше НЕ серце:</b> колючий біль, що вказується одним пальцем; триває секунди або цілий день; залежить від рухів тулуба, дихання, натискання на грудну клітку; минає після їжі.</div>
<h2>3. Обстеження</h2>
<ul><li><b>ЕКГ у спокої</b> (часто нормальна!), ЕхоКГ (ФВ, порушення скоротливості).</li>
<li>Аналізи: загальний аналіз крові (анемія посилює ішемію), глюкоза/HbA1c, ліпідограма, креатинін, ТТГ.</li>
<li>Підтвердження: <b>КТ-коронарографія</b> (при помірній ймовірності) або <b>стрес-тести</b> (стрес-ЕхоКГ, перфузійна сцинтиграфія, стрес-МРТ); навантажувальна ЕКГ — менш точна. Інвазивна коронарографія — при високій ймовірності чи тяжких симптомах.</li></ul>
<h2>4. Лікування</h2>
<h3>А. Покращити прогноз (усім)</h3>
<ul><li><b>Аспірин 75–100 мг</b> (при непереносимості — клопідогрель 75 мг).</li>
<li><b>Статин високої інтенсивності</b> (ціль ЛПНЩ &lt; 1,4).</li>
<li>іАПФ/сартан — при АГ, ЦД, ХХН, СН.</li>
<li>Відмова від куріння (найважливіше!), контроль АТ, глюкози, ваги, кардіореабілітація, щеплення від грипу.</li></ul>
<h3>Б. Прибрати симптоми</h3>
<ul><li><b>β-блокатор</b> (бісопролол, метопролол) — ↓ ЧСС → ↓ потреба в O₂, довша діастола. Або <b>БКК</b> (амлодипін; верапаміл/дилтіазем — не разом з β-блокатором і не при СН).</li>
<li>Далі — нітрати пролонговані, ранолазин, івабрадин, триметазидин.</li>
<li><b>Нітрогліцерин 0,4–0,5 мг під язик</b> — для зняття нападу і перед відомим навантаженням.</li></ul>
<div class="box mn"><b>Інструкція пацієнту з нітрогліцерином:</b> сісти (може запаморочитися) → 1 таблетка/доза під язик → якщо через 5 хв не минуло — ще одна і <b>викликати 103</b> → не минуло ще через 5 хв — третя. Біль &gt; 15–20 хв = можливий інфаркт.</div>
<div class="box warn"><b>Нітрати + силденафіл/тадалафіл</b> (інгібітори ФДЕ-5) — <b>протипоказано</b>: різке падіння тиску. Перед призначенням нітратів чоловікам — запитати!</div>
<h2>5. Реваскуляризація (стент або шунтування)</h2>
<p>Розглядають при симптомах, що не контролюються ліками, ураженні стовбура лівої коронарної артерії, багатосудинному ураженні зі зниженою ФВ. Для більшості стабільних пацієнтів <b>ліки + спосіб життя</b> так само ефективні для прогнозу, як і стент.</p>
<h2>6. 🚩 Червоні прапорці — нестабільна стенокардія / ГКС</h2>
<ul><li>Біль <b>уперше</b> виник за останні тижні або <b>посилюється</b> (частіше, сильніше, при меншому навантаженні).</li>
<li>Біль <b>у спокої</b>, &gt; 15–20 хв, не минає від нітрогліцерину.</li>
<li>Супроводжується холодним потом, задишкою, слабкістю, непритомністю → <b>103</b> (див. тему 4).</li></ul>

<p>Операції (особливо ортопедичні), травми, гіпс, <b>нерухомість</b> (госпіталізація, довгі перельоти), <b>рак</b> і хіміотерапія, <b>вагітність і післяпологовий період</b>, <b>естрогени</b> (КОК, ЗГТ), ожиріння, вік, попередній ТГВ, тромбофілії, COVID-19, СН.</p>
<h2>3. ТГВ: як розпізнати</h2>
<ul><li><b>Однобічний</b> набряк ноги (різниця обводу гомілок &gt; 3 см), біль/болючість по ходу вен, тепла шкіра, розширені поверхневі вени.</li>
<li>Оцінка за <b>шкалою Wells</b> (рак, паралічі, постільний режим/операція, болючість по ходу вен, набряк усієї ноги, різниця &gt; 3 см, ямковий набряк, колатеральні вени, попередній ТГВ; мінус 2 — якщо інший діагноз імовірніший).</li></ul>
<div class="flow">
<div class="floor"><b>Wells «малоймовірний»</b> → <b>D-димер</b>. Норма — ТГВ виключено. Підвищений → УЗД.</div>
<div class="floor"><b>Wells «ймовірний»</b> → одразу <b>компресійне УЗД</b> вен (вена не стискається датчиком = тромб).</div></div>
<div class="box">D-димер чутливий, але <b>неспецифічний</b>: ↑ у літніх, при вагітності, раку, інфекції, після операцій. Для &gt; 50 років — вікова межа (вік × 10 мкг/л). Його цінність — <b>виключити</b> тромб при низькій ймовірності.</div>
<h2>4. ТЕЛА: як розпізнати</h2>
<ul><li>Раптова <b>задишка</b> (найчастіше!), <b>плевральний біль</b> у грудях, <b>тахікардія</b>, кашель, кровохаркання, непритомність, SpO₂ ↓, ознаки ТГВ.</li>
<li>Оцінка: Wells для ТЕЛА / Женевська шкала; при дуже низькій ймовірності — правило <b>PERC</b>.</li>
<li>Підтвердження — <b>КТ-ангіографія легеневих артерій</b>. ЕКГ — часто лише синусова тахікардія.</li></ul>
<h2>5. Лікування</h2>
<ul><li><b>Антикоагулянт</b>: перевага — <b>НОАК</b> (апіксабан, ривароксабан — без попереднього гепарину). Вагітність — <b>НМГ</b>. Рак — НОАК або НМГ.</li>
<li><b>Тривалість</b>: мінімум <b>3 місяці</b>. Спровокований великим тимчасовим фактором (операція) — зазвичай 3 міс. <b>Неспровокований</b> або постійний фактор (рак) — розглянути <b>довгострокову</b> антикоагуляцію.</li>
<li>Більшість ТГВ і стабільних ТЕЛА низького ризику можна лікувати <b>амбулаторно</b>.</li>
<li>Рання ходьба дозволена. Компресійний трикотаж — для симптомів.</li>
<li>Неспровокований ТГВ — переглянути скринінг раку за віком (рутинний «пошук раку» — не потрібен).</li></ul>
<h2>6. Профілактика</h2>
<p>Оцінка ризику у госпіталізованих і після операцій (профілактичні дози НМГ/НОАК), ранній рух. Довгі перельоти: рухатися, пити воду; людям з високим ризиком — компресійні панчохи.</p>

<li>Кровотеча на антикоагулянтах.</li></ul>

<p>Усіх з <b>35 років</b> (кожні 3 роки при нормі), раніше — при надлишковій вазі + факторах ризику: родичі з ЦД, АГ, дисліпідемія, ССЗ, гестаційний діабет в анамнезі, СПКЯ, малорухливість, преддіабет.</p>

    '<form id="quiz">' + QZ.map((x, i) => '<div class="q" id="q' + i + '"><p>' + (i + 1) + '. ' + x.q + '</p>' +
      x.opts.map((o, j) => '<label><input type="radio" name="q' + i + '" value="' + j + '"> ' + o + '</label>').join('') + '<div class="exp"></div></div>').join('') + '</form>' +
    '<div class="btns"><button type="button" onclick="check(\'' + s + '\',' + n + ')">Перевірити</button><button type="button" onclick="renderMain(\'' + s + '\',' + n + ');document.getElementById(\'quiz\').scrollIntoView()">Пройти заново</button></div>' +
    '<div id="result"></div>' + pager + '</div>';
  window.scrollTo(0, 0);
}

function check(s, n) {
  let ok = 0, answered = 0;
  QZ.forEach((x, i) => {
    const el = document.getElementById('q' + i), sel = document.querySelector('input[name=q' + i + ']:checked');
    if (sel) answered++;
    const right = sel && x.opts[+sel.value] === x.right;
    if (right) ok++;
    el.className = 'q done ' + (right ? 'right' : 'wrong');
    el.querySelector('.exp').innerHTML = (right ? '✅ Правильно. ' : '❌ Правильна відповідь: <b>' + x.right + '</b>. ') + x.e;
  });
  const pct = Math.round(ok / QZ.length * 100), r = document.getElementById('result'), total = TOPICS[s].length;
  if (ok / QZ.length >= 0.9) {
    const key = s + '-' + n, old = P[key];
    P[key] = { s: Math.max(pct, old ? old.s : 0), d: new Date().toISOString().slice(0, 10) };
    save();
    renderTabs(s); renderSide(s, n);
    let next = '';
    if (n < total) {
      const lr = lockReasons(s, n + 1);
      next = lr.length ? '<br>Наступна тема поки закрита: ' + lr.map(x => x.txt.toLowerCase()).join('; ') + '.'
        : '<div class="btns"><button type="button" onclick="location.hash=\'#' + s + '-' + (n + 1) + '\'">Відкрити тему ' + (n + 1) + ' →</button></div>';
    } else next = '<br>🏆 Це була остання тема предмета «' + subjName(s) + '»!';
    r.className = 'pass';
    r.innerHTML = '🎉 <b>' + ok + ' з ' + QZ.length + ' (' + pct + ' %) — тему здано!</b>' + next;
  } else {
    r.className = 'fail';
    r.innerHTML = '<b>' + ok + ' з ' + QZ.length + ' (' + pct + ' %)</b> — поки менше 90 %. ' + (answered < QZ.length ? 'Є питання без відповіді. ' : '') + 'Прочитай пояснення під червоними питаннями (і відповідні розділи вище), потім натисни «Пройти заново».';
  }
  r.scrollIntoView({ behavior:'smooth', block:'center' });
}

// Власне вікно замість prompt/alert: на сторінці за посиланням браузер їх блокує
function dlg(title, html) {
  let d = document.getElementById('dlg');
  if (!d) { d = document.createElement('div'); d.id = 'dlg'; document.body.appendChild(d); }
  d.innerHTML = '<div class="dlgbox"><h3>' + title + '</h3>' + html + '</div>';
  d.style.display = 'flex';
}
function dlgClose() { document.getElementById('dlg').style.display = 'none'; }
function exportP() {
  dlg('💾 Копія прогресу', '<p>Скопіюй цей код і збережи (наприклад, у нотатках). Ним можна відновити прогрес або перенести його на інший пристрій.</p><textarea id="dlgText" rows="5" readonly></textarea><div class="btns"><button type="button" onclick="copyP()">Скопіювати</button><button type="button" onclick="dlgClose()">Закрити</button></div><p id="dlgMsg" class="sub"></p>');
  document.getElementById('dlgText').value = JSON.stringify(P);
}
function copyP() {
  const t = document.getElementById('dlgText'), m = document.getElementById('dlgMsg');
  t.select();
  const manual = () => { m.textContent = 'Код виділено — скопіюй його вручну.'; };
  try { navigator.clipboard.writeText(t.value).then(() => { m.textContent = 'Скопійовано.'; }, manual); } catch (e) { manual(); }
}
function importP() {
  dlg('📥 Відновити прогрес', '<p>Встав код копії прогресу:</p><textarea id="dlgText" rows="5"></textarea><div class="btns"><button type="button" onclick="applyP()">Відновити</button><button type="button" onclick="dlgClose()">Закрити</button></div><p id="dlgMsg" class="sub"></p>');
}
function applyP() {
  const m = document.getElementById('dlgMsg');
  try { mergeP(JSON.parse(document.getElementById('dlgText').value)); save(); route(); m.textContent = 'Прогрес відновлено.'; }
  catch (e) { m.textContent = 'Код не розпізнано. Перевір, що скопійовано повністю.'; }
}
function mergeP(d) {
  let changed = false;
  for (const k in d) if (d[k] && typeof d[k].s === 'number' && (!P[k] || d[k].s > P[k].s)) { P[k] = d[k]; changed = true; }
  return changed;
}

// Синхронізація між пристроями: працює лише на сторінці за посиланням; у локальному файлі нічого не робить
async function initSync() {
  if (!window.claude || !claude.use) return;
  try {
    const [db, user] = await Promise.all([claude.use('db'), claude.use('user')]);
    if (!db || !user) return;
    const id = await user.id();
    if (!id) return;
    const doc = db.collection('data/users/' + id).doc('progress');
    const snap = await doc.get();
    const data = snap && typeof snap.data === 'function' ? snap.data() : snap;
    const remote = (data && data.p) || {};
    if (mergeP(remote)) {
      save();
      const r = parseHash();
      if (r) { renderTabs(r.s); renderSide(r.s, r.n); if (document.querySelector('.lockbox')) renderMain(r.s, r.n); }
    }
    pushP = () => doc.set({ p: P }).catch(() => {});
    if (JSON.stringify(remote) !== JSON.stringify(P)) pushP();
  } catch (e) {}
}
window.addEventListener('load', initSync);

function route() {
  let r = parseHash();
  if (!r) {
    let last = null; try { last = localStorage.getItem('med-last'); } catch (e) {}
    location.replace(last || '#bio-' + current('bio'));
    return;
  }
  try { localStorage.setItem('med-last', location.hash); } catch (e) {}
  renderTabs(r.s); renderSide(r.s, r.n); renderMain(r.s, r.n);
  document.getElementById('side').classList.remove('open');
}
document.getElementById('menuBtn').onclick = () => document.getElementById('side').classList.toggle('open');
window.addEventListener('hashchange', route);
route();
</script>

if ('serviceWorker' in navigator) window.addEventListener('load', () => {
  navigator.serviceWorker.register('sw.js').catch(() => {});
  if (navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(() => {});
});
</script>
